name: larekmart-observability

# ============================================================================
# Larekmart Observability Stack — Docker Compose
#
# THE VERDICT:
#   - ENVIRONMENT: Best for STAGING & PRODUCTION TELEMETRY (Metrics & Alerting).
#   - WHY: Industry-standard CNCF observability stack (Prometheus + Grafana +
#     Loki + Alertmanager). Provides real-time CPU/RAM/DB metrics, latency percentiles
#     (p95/p99), SLA/SLO dashboards, and proactive alerting triggers (PagerDuty/Slack).
#   - HOW IT COMPARES:
#       * Dozzle: Ephemeral live container log viewer (Local dev inner loop).
#       * Rootprint: Deep log analytics & search via Quickwit on MinIO S3 (Forensics/traces).
#       * Observability Stack: Full-spectrum metrics, health dashboards, and alert triggers.
#
# Provides:
#   - Prometheus: Metrics scraper & TSDB storage (port 9090)
#   - Grafana: Unified dashboards & visualization (port 3001)
#   - Alertmanager: Alert routing & deduplication (port 9093)
#   - Loki + Promtail: LogQL stream aggregation (port 3100)
#   - cAdvisor: Per-container resource utilization (port 8087)
#   - OpenTelemetry Collector: Distributed traces & metrics ingestion (ports 4317/4318)
#   - Exporters: Node (9100), Redis (9121), Postgres (9187), Mongo (9216)
#
# Access:
#   - Grafana UI:           http://localhost:3001 (admin / grafana_admin_secret)
#   - Prometheus UI:        http://localhost:9090
#   - Alertmanager UI:      http://localhost:9093
#   - cAdvisor UI:          http://localhost:8087
#   - OTel Collector:       http://localhost:4318 (HTTP) / localhost:4317 (gRPC)
#   - Traefik Domain:       http://monitoring.localhost
#
# Usage:
#   docker compose -f docker-compose.observability.yml up -d
#
# This file uses the same larekmart-network as docker-compose.yml so that
# Prometheus can scrape microservices that are already running there.
# ============================================================================

services:
  # ────────────────────────────────────────────────────────────────────────────
  # Prometheus — Metrics collection and alerting engine
  # ────────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: larekmart-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - larekmart-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ────────────────────────────────────────────────────────────────────────────
  # Alertmanager — Deduplication, grouping, routing of alerts
  # ────────────────────────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: larekmart-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./infrastructure/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - larekmart-network

  # ────────────────────────────────────────────────────────────────────────────
  # Grafana — Dashboards and visualization
  # ────────────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    container_name: larekmart-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana_admin_secret}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: monitoring.larekmart.local
      GF_ALERTING_ENABLED: "true"
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlSearch traceQLStreaming metricsSummary"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - larekmart-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=larekmart-network"
      - "traefik.http.routers.grafana.rule=Host(`${GRAFANA_DOMAIN:-monitoring.localhost}`)"
      - "traefik.http.routers.grafana.entrypoints=web,websecure"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ────────────────────────────────────────────────────────────────────────────
  # Loki — Log aggregation (lightweight alternative to ELK)
  # ────────────────────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.1.0
    container_name: larekmart-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infrastructure/observability/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - larekmart-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ────────────────────────────────────────────────────────────────────────────
  # Promtail — Log shipper: reads Docker container logs and pushes to Loki
  # ────────────────────────────────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:3.1.0
    container_name: larekmart-promtail
    user: root
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./infrastructure/observability/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - larekmart-network
    depends_on:
      loki:
        condition: service_healthy

  # ────────────────────────────────────────────────────────────────────────────
  # Node Exporter — Host OS / hardware metrics
  # ────────────────────────────────────────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: larekmart-node-exporter
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - larekmart-network

  # ────────────────────────────────────────────────────────────────────────────
  # Redis Exporter — Redis metrics → Prometheus
  # ────────────────────────────────────────────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: larekmart-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    networks:
      - larekmart-network

  # ────────────────────────────────────────────────────────────────────────────
  # Postgres Exporter — PostgreSQL metrics → Prometheus
  # ────────────────────────────────────────────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: larekmart-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password123}@postgres:5432/product_db?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - larekmart-network

  # ────────────────────────────────────────────────────────────────────────────
  # MongoDB Exporter — MongoDB metrics → Prometheus
  # ────────────────────────────────────────────────────────────────────────────
  mongodb-exporter:
    image: percona/mongodb_exporter:0.41.2
    container_name: larekmart-mongodb-exporter
    restart: unless-stopped
    environment:
      MONGODB_URI: "mongodb://${MONGO_INITDB_ROOT_USERNAME:-root}:${MONGO_INITDB_ROOT_PASSWORD:-example}@mongo:27017/admin?authSource=admin"
    ports:
      - "9216:9216"
    networks:
      - larekmart-network

  # ────────────────────────────────────────────────────────────────────────────
  # cAdvisor — Per-container CPU, memory, network & I/O metrics → Prometheus
  # ────────────────────────────────────────────────────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: larekmart-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "${CADVISOR_PORT:-8087}:8087"
    networks:
      - larekmart-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8087/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ────────────────────────────────────────────────────────────────────────────
  # OpenTelemetry Collector — Distributed traces, metrics & logs ingestion
  # ────────────────────────────────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: larekmart-otel-collector
    restart: unless-stopped
    command:
      - --config=/etc/otel-collector-config.yml
    volumes:
      - ./infrastructure/observability/otel-collector/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317" # OTLP gRPC receiver
      - "${OTEL_HTTP_PORT:-4318}:4318" # OTLP HTTP receiver
      - "8889:8889" # Prometheus metrics exporter
    networks:
      - larekmart-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:13133/"]
      interval: 15s
      timeout: 5s
      retries: 3

# ────────────────────────────────────────────────────────────────────────────
# Named volumes for observability stack data persistence
# ────────────────────────────────────────────────────────────────────────────
volumes:
  prometheus_data:
    name: larekmart_prometheus_data
  alertmanager_data:
    name: larekmart_alertmanager_data
  grafana_data:
    name: larekmart_grafana_data
  loki_data:
    name: larekmart_loki_data

# ────────────────────────────────────────────────────────────────────────────
# Uses the same bridge network as main docker-compose.yml for service discovery
# ────────────────────────────────────────────────────────────────────────────
networks:
  larekmart-network:
    name: larekmart-network
    driver: bridge
    attachable: true
