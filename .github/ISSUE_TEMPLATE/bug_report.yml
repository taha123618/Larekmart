name: 🐛 Bug Report
description: Report a reproducible problem or unexpected error in Larekmart
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Larekmart! Please ensure this issue hasn't already been reported.
  - type: dropdown
    id: workspace
    attributes:
      label: Affected Workspace or Microservice
      description: Which service or frontend encountered this issue?
      options:
        - client (Storefront)
        - admin (Admin Dashboard)
        - api-gateway
        - product-service
        - order-service
        - payment-service
        - auth-service
        - analytic-service
        - notification-service
        - search-service
        - inventory-service
        - recommendation-service
        - cart-service
        - catalog-service
        - shipping-service
        - user-service
        - media-service
        - email-service
        - Shared Package (@repo/*)
        - Docker / Infrastructure
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Start the stack with `docker compose up`
        2. Send POST request to `/api/v1/orders`
        3. See error response...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Output
      description: Please copy and paste any relevant terminal, Docker, or console logs.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: OS version, Node version, Docker version, pnpm version.
      placeholder: macOS 15.1, Node 20.12.0, pnpm 9.0.0, Docker 26.0
