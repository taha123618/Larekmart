name: CI — Larekmart Monorepo

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/larekmart

jobs:
  # ════════════════════════════════════════════════════════════════
  # STAGE 1: Code Quality (always runs — fast fail gate)
  # ════════════════════════════════════════════════════════════════
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (admin + client)
        run: pnpm lint

      - name: Format check
        run: pnpm format --check

      - name: Type check (all workspaces)
        run: pnpm check-types

  # ════════════════════════════════════════════════════════════════
  # STAGE 2: Build validation
  # ════════════════════════════════════════════════════════════════
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Clients
        run: |
          pnpm --filter @repo/product-db db:generate
          pnpm --filter @repo/inventory-db db:generate
          pnpm --filter @repo/catalog-db db:generate
          pnpm --filter @repo/shipping-db db:generate

      - name: Build
        run: pnpm build

  # ════════════════════════════════════════════════════════════════
  # STAGE 3: Go tests (notification-service)
  # ════════════════════════════════════════════════════════════════
  go-tests:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: apps/notification-service/go.sum

      - name: Run Go Tests
        working-directory: apps/notification-service
        run: go test ./... -v -race

  # ════════════════════════════════════════════════════════════════
  # STAGE 4: Python tests (recommendation-service)
  # ════════════════════════════════════════════════════════════════
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python via uv
        run: |
          pip install uv
          cd apps/recommendation-service
          uv sync

      - name: Run Python lint
        working-directory: apps/recommendation-service
        run: |
          uv run ruff check .
          uv run mypy app/ --ignore-missing-imports || true

  # ════════════════════════════════════════════════════════════════
  # STAGE 5: Docker Build & Push (only on push to main/develop)
  # ════════════════════════════════════════════════════════════════
  docker-build:
    name: Docker Build — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [build, go-tests, python-tests]
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        service:
          - client
          - admin
          - product-service
          - order-service
          - payment-service
          - auth-service
          - analytic-service
          - notification-service
          - search-service
          - inventory-service
          - recommendation-service
          - cart-service
          - catalog-service
          - shipping-service
          - email-service

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: tag
        run: |
          SHA_SHORT="${GITHUB_SHA::8}"
          BRANCH="${GITHUB_REF_NAME//\//-}"
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            echo "tag=latest,${SHA_SHORT}" >> $GITHUB_OUTPUT
          else
            echo "tag=${BRANCH},${SHA_SHORT}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ steps.tag.outputs.tag }}"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

  # ════════════════════════════════════════════════════════════════
  # STAGE 6: Validate Kubernetes Manifests
  # ════════════════════════════════════════════════════════════════
  validate-k8s:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Kustomize (development)
        run: kubectl kustomize infrastructure/kubernetes/overlays/development > /dev/null

      - name: Validate Kustomize (staging)
        run: kubectl kustomize infrastructure/kubernetes/overlays/staging > /dev/null

      - name: Validate Kustomize (production)
        run: kubectl kustomize infrastructure/kubernetes/overlays/production > /dev/null

      - name: Validate Docker Compose
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.observability.yml config --quiet

  # ════════════════════════════════════════════════════════════════
  # STAGE 7: Deploy to Staging (on push to develop)
  # ════════════════════════════════════════════════════════════════
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker-build, validate-k8s]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.larekmart.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.STAGING_KUBECONFIG }}

      - name: Deploy staging overlay
        run: |
          SHA_SHORT="${GITHUB_SHA::8}"
          # Update image tags in overlay
          for svc in client admin product-service order-service payment-service auth-service \
                     analytic-service notification-service search-service inventory-service \
                     recommendation-service cart-service catalog-service shipping-service email-service; do
            kubectl kustomize infrastructure/kubernetes/overlays/staging | \
              sed "s|larekmart/${svc}:staging|${{ env.REGISTRY }}/${{ github.repository_owner }}/larekmart/${svc}:${SHA_SHORT}|g" | \
              kubectl apply -f -
          done

      - name: Verify rollout
        run: |
          kubectl rollout status deployment --namespace=larekmart-staging --timeout=3m

  # ════════════════════════════════════════════════════════════════
  # STAGE 8: Deploy to Production (on push to main — requires approval)
  # ════════════════════════════════════════════════════════════════
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build, validate-k8s]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://larekmart.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.PRODUCTION_KUBECONFIG }}

      - name: Deploy production overlay
        run: |
          SHA_SHORT="${GITHUB_SHA::8}"
          kubectl kustomize infrastructure/kubernetes/overlays/production | \
            kubectl apply -f -

      - name: Verify rollout
        run: |
          kubectl rollout status deployment --namespace=larekmart --timeout=5m
