name: Database Migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      action:
        description: "Migration action"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - status

jobs:
  migrate:
    name: Run Database Migrations (${{ github.event.inputs.environment }} - ${{ github.event.inputs.action }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment }}
    env:
      PRODUCT_DATABASE_URL: ${{ secrets.PRODUCT_DATABASE_URL }}
      INVENTORY_DATABASE_URL: ${{ secrets.INVENTORY_DATABASE_URL }}
      CATALOG_DATABASE_URL: ${{ secrets.CATALOG_DATABASE_URL }}
      SHIPPING_DATABASE_URL: ${{ secrets.SHIPPING_DATABASE_URL }}
      USER_DATABASE_URL: ${{ secrets.USER_DATABASE_URL }}
      MEDIA_DATABASE_URL: ${{ secrets.MEDIA_DATABASE_URL }}
      REVIEW_DATABASE_URL: ${{ secrets.REVIEW_DATABASE_URL }}
      WISHLIST_DATABASE_URL: ${{ secrets.WISHLIST_DATABASE_URL }}
      PROMOTION_DATABASE_URL: ${{ secrets.PROMOTION_DATABASE_URL }}
      TAX_DATABASE_URL: ${{ secrets.TAX_DATABASE_URL }}
      RETURN_DATABASE_URL: ${{ secrets.RETURN_DATABASE_URL }}
      PRICING_DATABASE_URL: ${{ secrets.PRICING_DATABASE_URL }}
      VENDOR_DATABASE_URL: ${{ secrets.VENDOR_DATABASE_URL }}
      SELLER_DATABASE_URL: ${{ secrets.SELLER_DATABASE_URL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Database Clients (Prisma & Drizzle)
        run: pnpm db:generate

      - name: Check Migration Status
        if: github.event.inputs.action == 'status'
        run: |
          echo "=== [Stage 1] Product DB Migration Status ==="
          DATABASE_URL="${PRODUCT_DATABASE_URL}" pnpm --filter @repo/product-db exec prisma migrate status || true
          echo "=== [Stage 1] Inventory DB Migration Status ==="
          DATABASE_URL="${INVENTORY_DATABASE_URL}" pnpm --filter @repo/inventory-db exec prisma migrate status || true
          echo "=== [Stage 1] User DB Migration Status ==="
          DATABASE_URL="${USER_DATABASE_URL}" pnpm --filter @repo/user-db exec prisma migrate status || true
          echo "=== [Stage 1] Vendor DB Migration Status ==="
          DATABASE_URL="${VENDOR_DATABASE_URL}" pnpm --filter @repo/vendor-db exec prisma migrate status || true
          echo "=== [Stage 2] Shipping DB Migration Status ==="
          DATABASE_URL="${SHIPPING_DATABASE_URL}" pnpm --filter @repo/shipping-db exec prisma migrate status || true
          echo "=== [Stage 3] Catalog DB Migration Status ==="
          DATABASE_URL="${CATALOG_DATABASE_URL}" pnpm --filter @repo/catalog-db exec prisma migrate status || true

      # ─── STAGE 1: Foundational Master Entity Schemas ───
      - name: Run product-db migrations (Stage 1)
        if: github.event.inputs.action == 'deploy'
        run: pnpm --filter @repo/product-db db:deploy
        env:
          DATABASE_URL: ${{ env.PRODUCT_DATABASE_URL }}

      - name: Run inventory-db migrations (Stage 1)
        if: github.event.inputs.action == 'deploy'
        run: pnpm --filter @repo/inventory-db db:deploy
        env:
          DATABASE_URL: ${{ env.INVENTORY_DATABASE_URL }}

      - name: Run user-db migrations (Stage 1)
        if: github.event.inputs.action == 'deploy'
        run: pnpm --filter @repo/user-db db:deploy
        env:
          DATABASE_URL: ${{ env.USER_DATABASE_URL }}

      - name: Run vendor-db migrations (Stage 1)
        if: github.event.inputs.action == 'deploy' && env.VENDOR_DATABASE_URL != ''
        run: pnpm --filter @repo/vendor-db db:deploy
        env:
          DATABASE_URL: ${{ env.VENDOR_DATABASE_URL }}

      # ─── STAGE 2: Operational & Transactional Schemas ───
      - name: Run shipping-db migrations (Stage 2)
        if: github.event.inputs.action == 'deploy'
        run: pnpm --filter @repo/shipping-db db:deploy
        env:
          DATABASE_URL: ${{ env.SHIPPING_DATABASE_URL }}

      - name: Run media-service (Drizzle) migrations (Stage 2)
        if: github.event.inputs.action == 'deploy' && env.MEDIA_DATABASE_URL != ''
        run: pnpm --filter media-service db:deploy
        env:
          DATABASE_URL: ${{ env.MEDIA_DATABASE_URL }}

      - name: Run pricing-service (PostgreSQL Drizzle) migrations (Stage 2)
        if: github.event.inputs.action == 'deploy' && env.PRICING_DATABASE_URL != ''
        run: pnpm --filter pricing-service db:deploy
        env:
          DATABASE_URL: ${{ env.PRICING_DATABASE_URL }}

      - name: Run promotion-service (Drizzle) migrations (Stage 2)
        if: github.event.inputs.action == 'deploy' && env.PROMOTION_DATABASE_URL != ''
        run: pnpm --filter promotion-service db:deploy
        env:
          DATABASE_URL: ${{ env.PROMOTION_DATABASE_URL }}

      - name: Run tax-service (MySQL Drizzle) migrations (Stage 2)
        if: github.event.inputs.action == 'deploy' && env.TAX_DATABASE_URL != ''
        run: pnpm --filter tax-service db:deploy
        env:
          MYSQL_URL: ${{ env.TAX_DATABASE_URL }}

      - name: Run return-service (MySQL Drizzle) migrations (Stage 2)
        if: github.event.inputs.action == 'deploy' && env.RETURN_DATABASE_URL != ''
        run: pnpm --filter return-service db:deploy
        env:
          MYSQL_URL: ${{ env.RETURN_DATABASE_URL }}

      # ─── STAGE 3: Read Projections, Storefronts & Downstream Schemas ───
      - name: Run catalog-db migrations (Stage 3 Projections)
        if: github.event.inputs.action == 'deploy'
        run: pnpm --filter @repo/catalog-db db:deploy
        env:
          DATABASE_URL: ${{ env.CATALOG_DATABASE_URL }}

      - name: Run seller-service (PostgreSQL Drizzle) migrations (Stage 3)
        if: github.event.inputs.action == 'deploy' && env.SELLER_DATABASE_URL != ''
        run: pnpm --filter seller-service db:deploy
        env:
          DATABASE_URL: ${{ env.SELLER_DATABASE_URL }}

      - name: Run review-service (Drizzle) migrations (Stage 3)
        if: github.event.inputs.action == 'deploy' && env.REVIEW_DATABASE_URL != ''
        run: pnpm --filter review-service db:deploy
        env:
          DATABASE_URL: ${{ env.REVIEW_DATABASE_URL }}

      - name: Run wishlist-service (Drizzle) migrations (Stage 3)
        if: github.event.inputs.action == 'deploy' && env.WISHLIST_DATABASE_URL != ''
        run: pnpm --filter wishlist-service db:deploy
        env:
          DATABASE_URL: ${{ env.WISHLIST_DATABASE_URL }}

