name: "Argo CD GitOps Validation"

on:
  push:
    branches:
      - main
    paths:
      - "infrastructure/kubernetes/**"
      - "infrastructure/argocd/**"
  pull_request:
    branches:
      - main
    paths:
      - "infrastructure/kubernetes/**"
      - "infrastructure/argocd/**"

jobs:
  validate-manifests:
    name: "Validate Kubernetes & Argo CD Manifests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.4.1"

      - name: Build & Validate Development Overlay
        run: |
          kustomize build infrastructure/kubernetes/overlays/development > /dev/null

      - name: Build & Validate Staging Overlay
        run: |
          kustomize build infrastructure/kubernetes/overlays/staging > /dev/null

      - name: Build & Validate Production Overlay
        run: |
          kustomize build infrastructure/kubernetes/overlays/production > /dev/null

      - name: Validate Argo CD Manifests Syntax
        run: |
          python3 -c "
          import yaml, glob
          for f in glob.glob('infrastructure/argocd/**/*.yaml', recursive=True):
              yaml.safe_load_all(open(f))
              print(f'Valid YAML: {f}')
          "
