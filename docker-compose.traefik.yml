name: larekmart-traefik

# ============================================================================
# Larekmart Traefik Edge Router & Ingress Proxy
# Provides:
#   - Automatic HTTPS with Let's Encrypt ACME resolver
#   - Dynamic Docker container discovery over larekmart-network
#   - Traefik Dashboard (port 8088 / websecure: api@internal)
#   - (Port 8080 is reserved exclusively for Kafka UI)
# ============================================================================

services:
  traefik:
    image: traefik:latest
    container_name: larekmart-traefik
    restart: unless-stopped
    command:
      - "--api=true"
      - "--api.dashboard=true"
      - "--log.level=${TRAEFIK_LOG_LEVEL:-INFO}"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=larekmart-network"
      - "--entrypoints.traefik.address=:8088"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.cert-resolver.acme.httpchallenge=true"
      - "--certificatesresolvers.cert-resolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.cert-resolver.acme.email=${ACME_EMAIL:-support@larekmart.com}"
      - "--certificatesresolvers.cert-resolver.acme.storage=/letsencrypt/acme.json"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./certificates/letsencrypt:/letsencrypt"
    labels:
      traefik.enable: "true"
      traefik.port: 8088
      traefik.http.routers.api.entrypoints: "websecure"
      traefik.http.routers.api.rule: "Host(`${TRAEFIK_DASHBOARD_DOMAIN:-traefik.localhost}`)"
      traefik.http.routers.api.service: "api@internal"
      traefik.http.routers.api.tls: "true"
      traefik.http.routers.api.tls.certresolver: "cert-resolver"
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
      - "${TRAEFIK_DASHBOARD_PORT:-8088}:8088"
    networks:
      - larekmart-network

networks:
  larekmart-network:
    name: larekmart-network
    driver: bridge
    attachable: true
