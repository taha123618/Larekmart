# ==============================================================================
# Larekmart Production Multi-Node Redis Cluster Configuration
# High-Velocity Flash Sales & Sharded Inventory Optimization
# ==============================================================================

# Network & Ports
bind 0.0.0.0
port 6379
protected-mode no

# Core Cluster Networking
cluster-enabled yes
cluster-config-file nodes.conf
cluster-node-timeout 5000
cluster-require-full-coverage no

# Memory Allocation Guardrails
maxmemory 768mb
maxmemory-policy volatile-ttl

# Persistence Tailored to High-Velocity Flash Operations
# Deactivates synchronous snapshot blocks to remove I/O forks on threads
save ""
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
