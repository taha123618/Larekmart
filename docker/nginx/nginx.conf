# ==============================================================================
# Larekmart Production Nginx Gateway & Reverse Proxy Configuration
# ==============================================================================

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance Optimizations
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;
    server_tokens       off;

    # Max upload body size (suitable for media uploads & big payloads)
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # WebSocket / SSE Connection Mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream Microservices on larekmart-network
    upstream api_gateway {
        server api-gateway:8090;
        keepalive 32;
    }

    upstream client_storefront {
        server client:3002;
        keepalive 32;
    }

    upstream admin_dashboard {
        server admin:3003;
        keepalive 32;
    }

    upstream dozzle_logs {
        server dozzle:8888;
        keepalive 16;
    }

    upstream grafana_service {
        server grafana:3000;
        keepalive 16;
    }

    upstream rootprint_service {
        server rootprint:8282;
        keepalive 16;
    }

    # ==========================================================================
    # Main Server Block (Port 80)
    # ==========================================================================
    server {
        listen 80;
        server_name _;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Healthcheck endpoint
        location /healthz {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ----------------------------------------------------------------------
        # 1. Dozzle Container Logs (/logs/)
        # ----------------------------------------------------------------------
        location /logs/ {
            proxy_pass http://dozzle_logs/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering for live Server-Sent Events (SSE) log streaming
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
        }

        # ----------------------------------------------------------------------
        # 2. Larekmart API Gateway (/api/ routes)
        # ----------------------------------------------------------------------
        location /api/ {
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # ----------------------------------------------------------------------
        # 3. Next.js Admin Panel (/admin/)
        # ----------------------------------------------------------------------
        location /admin/ {
            proxy_pass http://admin_dashboard;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------------------
        # 4. Observability - Grafana (/grafana/)
        # ----------------------------------------------------------------------
        location /grafana/ {
            proxy_pass http://grafana_service/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------------------
        # 5. Log Analytics - Rootprint (/rootprint/)
        # ----------------------------------------------------------------------
        location /rootprint/ {
            proxy_pass http://rootprint_service/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------------------
        # 6. Default Route (Dozzle Log Viewer on logs-nginx container)
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://dozzle_logs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Real-time SSE / streaming log support
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
        }
    }
}
