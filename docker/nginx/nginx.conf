# ==============================================================================
# Larekmart - Nginx Reverse Proxy for Dozzle Live Container Logs
# ==============================================================================
# Role: Dedicated reverse proxy fronting Dozzle (8888) with 100M payload buffer
# and unbuffered Server-Sent Events (SSE) / WebSocket log streaming.
# Application reverse proxying is handled cleanly by Caddy (Caddyfile).
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance & Payload Configuration
    client_max_body_size 100M;
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;

    # WebSocket / SSE Connection Mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://dozzle:8888;
            proxy_http_version 1.1;

            # Real-time WebSocket & SSE Headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering for live Server-Sent Events (SSE) log streaming
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Healthcheck probe
        location /healthz {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
