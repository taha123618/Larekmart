; ==============================================================================
; Larekmart - PgBouncer Connection Pooler Configuration
; Designed for Daraz-scale flash sale concurrency and pool isolation.
; ==============================================================================

[databases]
; Fallback wildcard for any dynamic database connection
* = host=postgres port=5432 auth_user=postgres

; Tier 1: Core Commerce & Checkout (High Priority, Dedicated Pools)
product_db = host=postgres port=5432 pool_size=30 auth_user=postgres
inventory_db = host=postgres port=5432 pool_size=35 auth_user=postgres
catalog_db = host=postgres port=5432 pool_size=25 auth_user=postgres
pricing_db = host=postgres port=5432 pool_size=25 auth_user=postgres
vendor_db = host=postgres port=5432 pool_size=15 auth_user=postgres
seller_db = host=postgres port=5432 pool_size=15 auth_user=postgres
shipping_db = host=postgres port=5432 pool_size=15 auth_user=postgres
user_db = host=postgres port=5432 pool_size=15 auth_user=postgres
promotion_db = host=postgres port=5432 pool_size=15 auth_user=postgres

; Tier 2: Search & Recommendations (Medium Priority)
recommendation_db = host=postgres port=5432 pool_size=10 auth_user=postgres
notification_db = host=postgres port=5432 pool_size=10 auth_user=postgres

; Tier 3: Engagement & Secondary Services (Capped to prevent pool starvation)
; Note: analytics_db is physically isolated on dedicated postgres-analytics container
review_db = host=postgres port=5432 pool_size=8 auth_user=postgres
media_db = host=postgres port=5432 pool_size=8 auth_user=postgres
wishlist_db = host=postgres port=5432 pool_size=8 auth_user=postgres

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres
stats_users = postgres

; Transaction pooling for maximum connection multiplexing across microservices
pool_mode = transaction

; Connection limits
max_client_conn = 1000
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 10
reserve_reserver_timeout = 5
max_db_connections = 250
max_user_connections = 250

; Health checks and query resets
server_reset_query = DISCARD ALL
server_check_delay = 30
server_check_query = select 1
server_lifetime = 3600
server_idle_timeout = 600
client_idle_timeout = 0
client_login_timeout = 60
query_timeout = 0
query_wait_timeout = 120

; Driver compatibility (Prisma, node-postgres, and JDBC client handshakes)
ignore_startup_parameters = extra_float_digits,search_path,timezone
