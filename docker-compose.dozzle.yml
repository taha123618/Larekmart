name: larekmart-dozzle-logs

# ============================================================================
# Larekmart Live Container Logs Stack (Dozzle)
#
# Provides:
#   - Dozzle: Lightweight real-time streaming Docker container log viewer (port 8888)
#   - Traefik Integration: Auto-routed directly to Dozzle on larekmart-network
#
# Access:
#   - Direct:           http://localhost:8085
#   - Traefik Hostname: http://logs.localhost
# ============================================================================

services:
  dozzle:
    image: amir20/dozzle:latest
    container_name: larekmart-dozzle
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    restart: unless-stopped
    environment:
      DOZZLE_ADDR: ":8888"
      DOZZLE_LEVEL: info
      DOZZLE_TAILSIZE: 300
    expose:
      - 8888
    ports:
      - "${LOGS_BIND_IP:-127.0.0.1}:${LOGS_PORT:-8085}:8888"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.logs-svc.rule=Host(`${LOGS_DOMAIN:-logs.localhost}`)"
      - "traefik.http.services.logs-svc.loadbalancer.server.port=8888"
      - "traefik.http.routers.logs-svc.entrypoints=web,websecure"
      - "traefik.docker.network=larekmart-network"
    networks:
      - larekmart-network

networks:
  larekmart-network:
    name: larekmart-network
    driver: bridge
    attachable: true
