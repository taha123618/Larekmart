version: '3.8'

services:
  # 1. Redis Service
  redis:
    build:
      context: .
      dockerfile: Dockerfile.redis
    container_name: custom_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 2. MongoDB Service
  mongodb:
    build:
      context: .
      dockerfile: Dockerfile.mongodb
    container_name: custom_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongo_data:/data/db

  # 3. PostgreSQL Service
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: custom_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: my_database
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 4. Apache Kafka Service
  kafka:
    build:
      context: .
      dockerfile: Dockerfile.kafka
    container_name: custom_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  # 5. OpenSearch Service
  opensearch:
    build:
      context: .
      dockerfile: Dockerfile.opensearch
    container_name: custom_opensearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=SecurePassword123!
    volumes:
      - opensearch_data:/usr/share/opensearch/data

# Named volumes to keep data persistent when containers stop
volumes:
  redis_data:
  mongo_data:
  postgres_data:
  opensearch_data:
