      - "8016"
    ports:
      - "${INTERNAL_SERVICE_BIND_IP:-127.0.0.1}:8016:8016"
    env_file:
      - ./apps/promotion-service/.env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8016/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - larekmart-network

  tax-service:
    build:
      context: .
      dockerfile: apps/tax-service/Dockerfile
    container_name: larekmart-tax-service
    restart: unless-stopped
    expose:
      - "8017"
    ports:
      - "${INTERNAL_SERVICE_BIND_IP:-127.0.0.1}:8017:8017"
    env_file:
      - ./apps/tax-service/.env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8017/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - larekmart-network

  return-service:
    build:
      context: .
      dockerfile: apps/return-service/Dockerfile
    container_name: larekmart-return-service
    restart: unless-stopped
    expose:
      - "8018"
    ports:
      - "${INTERNAL_SERVICE_BIND_IP:-127.0.0.1}:8018:8018"
    env_file:
      - ./apps/return-service/.env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8018/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - larekmart-network

  # ============================================================================
  # API Gateway (Centralized API Gateway for the Application)
  # ============================================================================

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: larekmart-api-gateway
    restart: unless-stopped
    expose:
      - "8090"
    ports:
      - "${API_GATEWAY_BIND_IP:-127.0.0.1}:${API_GATEWAY_PORT:-8090}:8090"
    env_file:
      - ./apps/api-gateway/.env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8090/health/ready || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      analytic-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      search-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      shipping-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
      review-service:
        condition: service_healthy
      wishlist-service:
        condition: service_healthy
      promotion-service:
        condition: service_healthy
      tax-service:
        condition: service_healthy
      return-service:
        condition: service_healthy
    networks:
      - larekmart-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=larekmart-network"
      # REST API Router
      - "traefik.http.routers.api-gateway.rule=Host(`${API_DOMAIN:-api.localhost}`) || (Host(`${DOMAIN:-localhost}`) && PathPrefix(`/api`))"
      - "traefik.http.routers.api-gateway.entrypoints=web,websecure"
      - "traefik.http.routers.api-gateway.middlewares=sec-headers,compress,rate-limit,retry"
      - "traefik.http.services.api-gateway.loadbalancer.server.port=8090"
      - "traefik.http.services.api-gateway.loadbalancer.healthcheck.path=/health/ready"
      - "traefik.http.services.api-gateway.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.api-gateway.loadbalancer.healthcheck.timeout=3s"
      # Real-Time WebSocket Router with Session Affinity for Horizontal Scaling
      - "traefik.http.routers.api-gateway-ws.rule=(Host(`${API_DOMAIN:-api.localhost}`) || Host(`${DOMAIN:-localhost}`)) && PathPrefix(`/ws`)"
      - "traefik.http.routers.api-gateway-ws.entrypoints=web,websecure"
      - "traefik.http.routers.api-gateway-ws.service=api-gateway-ws-svc"
      - "traefik.http.services.api-gateway-ws-svc.loadbalancer.server.port=8090"
      - "traefik.http.services.api-gateway-ws-svc.loadbalancer.sticky.cookie=true"
      - "traefik.http.services.api-gateway-ws-svc.loadbalancer.sticky.cookie.name=lm_ws_affinity"
      - "traefik.http.services.api-gateway-ws-svc.loadbalancer.sticky.cookie.httpOnly=true"
      - "traefik.http.services.api-gateway-ws-svc.loadbalancer.sticky.cookie.sameSite=lax"

  # ============================================================================
  # Frontends (Storefront & Admin)
  # ============================================================================

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_API_GATEWAY_URL: http://localhost:8090
        NEXT_PUBLIC_PRODUCT_SERVICE_URL: http://localhost:8090
        NEXT_PUBLIC_ORDER_SERVICE_URL: http://localhost:8090
        NEXT_PUBLIC_PAYMENT_SERVICE_URL: http://localhost:8090
        NEXT_PUBLIC_CART_SERVICE_URL: http://localhost:8090
        NEXT_PUBLIC_INVENTORY_SERVICE_URL: http://localhost:8090
        NEXT_PUBLIC_SEARCH_SERVICE_URL: http://localhost:8090
        NEXT_PUBLIC_NOTIFICATION_SERVICE_URL: http://localhost:8090
        NEXT_PUBLIC_RECOMMENDATION_SERVICE_URL: http://localhost:8090
        NEXT_PUBLIC_SHIPPING_SERVICE_URL: http://localhost:8090
        NEXT_PUBLIC_CATALOG_SERVICE_URL: http://localhost:8090
        NEXT_PUBLIC_USER_SERVICE_URL: http://localhost:8090
        NEXT_PUBLIC_MEDIA_SERVICE_URL: http://localhost:8090
    container_name: larekmart-client
    restart: unless-stopped
    ports:
      - "${CLIENT_BIND_IP:-127.0.0.1}:${CLIENT_PORT:-3002}:3002"
    env_file:
      - ./apps/client/.env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:3002/ || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - larekmart-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=larekmart-network"
      - "traefik.http.routers.client.rule=Host(`${CLIENT_DOMAIN:-shop.localhost}`) || Host(`${STORE_DOMAIN:-larekmart.localhost}`) || Host(`localhost`)"
      - "traefik.http.routers.client.entrypoints=web,websecure"
      - "traefik.http.routers.client.middlewares=sec-headers,compress"
      - "traefik.http.services.client.loadbalancer.server.port=3002"
      - "traefik.http.services.client.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.client.loadbalancer.healthcheck.interval=15s"

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_API_GATEWAY_URL: http://localhost:8090
        NEXT_PUBLIC_PRODUCT_SERVICE_URL: http://localhost:8090
        NEXT_PUBLIC_ORDER_SERVICE_URL: http://localhost:8090
        NEXT_PUBLIC_AUTH_SERVICE_URL: http://localhost:8090
        NEXT_PUBLIC_ANALYTIC_SERVICE_URL: http://localhost:8090
        NEXT_PUBLIC_NOTIFICATION_SERVICE_URL: http://localhost:8090
        NEXT_PUBLIC_SEARCH_SERVICE_URL: http://localhost:8090
        NEXT_PUBLIC_INVENTORY_SERVICE_URL: http://localhost:8090
        NEXT_PUBLIC_CART_SERVICE_URL: http://localhost:8090
        NEXT_PUBLIC_CATALOG_SERVICE_URL: http://localhost:8090
        NEXT_PUBLIC_SHIPPING_SERVICE_URL: http://localhost:8090
        NEXT_PUBLIC_RECOMMENDATION_SERVICE_URL: http://localhost:8090
        NEXT_PUBLIC_USER_SERVICE_URL: http://localhost:8090
        NEXT_PUBLIC_MEDIA_SERVICE_URL: http://localhost:8090
    container_name: larekmart-admin
    restart: unless-stopped
    ports:
      - "${ADMIN_BIND_IP:-127.0.0.1}:${ADMIN_PORT:-3003}:3003"
    env_file:
      - ./apps/admin/.env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:3003/ || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - larekmart-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=larekmart-network"
      - "traefik.http.routers.admin.rule=Host(`${ADMIN_DOMAIN:-admin.localhost}`)"
      - "traefik.http.routers.admin.entrypoints=web,websecure"
      - "traefik.http.routers.admin.middlewares=sec-headers,compress"
      - "traefik.http.services.admin.loadbalancer.server.port=3003"
      - "traefik.http.services.admin.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.admin.loadbalancer.healthcheck.interval=15s"

# ============================================================================
# Persistent Storage Volumes
# ============================================================================
volumes:
  postgres_data:
    name: larekmart_postgres_data
  mongo_data:
    name: larekmart_mongo_data
  redis_data:
    name: larekmart_redis_data
  kafka_data:
    name: larekmart_kafka_data
  opensearch_data:
    name: larekmart_opensearch_data
  mysql_data:
    name: larekmart_mysql_data

# ============================================================================
# Networks
# ============================================================================
networks:
  larekmart-network:
    name: larekmart-network
    driver: bridge
    attachable: true
