  # Image-processing worker — scales independently of the API service.
  media-worker:
    build:
      context: .
      dockerfile: apps/media-service/Dockerfile
    container_name: larekmart-media-worker
    restart: unless-stopped
    command: ["node", "dist/workers/processing.worker.js"]
    env_file:
      - ./apps/media-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - larekmart-network

  # Cleanup / garbage-collection worker (expired sessions, purge of soft-deleted media).
  media-cleanup:
    build:
      context: .
      dockerfile: apps/media-service/Dockerfile
    container_name: larekmart-media-cleanup
    restart: unless-stopped
    command: ["node", "dist/workers/cleanup.worker.js"]
    env_file:
      - ./apps/media-service/.env
    depends_on:
      postgres:
        condition: service_healthy
