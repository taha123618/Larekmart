  # ============================================================================
  # API Gateway (Centralized API Gateway for the Application)
  # ============================================================================

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: larekmart-api-gateway
    deploy: *heavy-deploy
    restart: unless-stopped
    expose:
      - "8090"
    ports:
      - "${API_GATEWAY_BIND_IP:-127.0.0.1}:${API_GATEWAY_PORT:-8090}:8090"
    env_file:
      - ./apps/api-gateway/.env
    environment:
      - "ANALYTIC_SERVICE_URL=http://analytic-service:8004"
      - "PRODUCT_SERVICE_URL=http://product-service:8000"
      - "ORDER_SERVICE_URL=http://order-service:8001"
      - "PAYMENT_SERVICE_URL=http://payment-service:8002"
      - "AUTH_SERVICE_URL=http://auth-service:8003"
      - "NOTIFICATION_SERVICE_URL=http://notification-service:8005"
      - "SEARCH_SERVICE_URL=http://search-service:8006"
      - "INVENTORY_SERVICE_URL=http://inventory-service:8007"
      - "RECOMMENDATION_SERVICE_URL=http://recommendation-service:8008"
      - "CART_SERVICE_URL=http://cart-service:8009"
      - "CATALOG_SERVICE_URL=http://catalog-service:8010"
      - "SHIPPING_SERVICE_URL=http://shipping-service:8011"
      - "USER_SERVICE_URL=http://user-service:8012"
      - "MEDIA_SERVICE_URL=http://media-service:8013"
      - "REVIEW_SERVICE_URL=http://review-service:8014"
      - "WISHLIST_SERVICE_URL=http://wishlist-service:8015"
      - "PROMOTION_SERVICE_URL=http://promotion-service:8016"
      - "TAX_SERVICE_URL=http://tax-service:8017"
      - "RETURN_SERVICE_URL=http://return-service:8018"
      - "PRICING_SERVICE_URL=http://pricing-service:8019"
      - "VENDOR_SERVICE_URL=http://vendor-service:8020"
      - "SELLER_SERVICE_URL=http://seller-service:8021"
      - "REDIS_URL=redis://redis:6379"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8090/health/ready || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - larekmart-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=larekmart-network"
      # Primary Gateway REST Router (Dedicated API Host - Priority 100)
      - "traefik.http.routers.api-gateway.rule=Host(`${API_DOMAIN:-api.localhost}`)"
      - "traefik.http.routers.api-gateway.entrypoints=web,websecure"
      - "traefik.http.routers.api-gateway.middlewares=sec-headers,compress,rate-limit,retry"
      - "traefik.http.routers.api-gateway.priority=100"
      - "traefik.http.services.api-gateway.loadbalancer.server.port=8090"
      - "traefik.http.services.api-gateway.loadbalancer.healthcheck.path=/health/ready"
      - "traefik.http.services.api-gateway.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.api-gateway.loadbalancer.healthcheck.timeout=3s"
      # Shared Storefront API Router (Strict Host && PathPrefix - Priority 100)
      - "traefik.http.routers.api-gateway-path.rule=(Host(`${DOMAIN:-localhost}`) || Host(`${CLIENT_DOMAIN:-shop.localhost}`) || Host(`${STORE_DOMAIN:-larekmart.localhost}`) || Host(`${ADMIN_DOMAIN:-admin.localhost}`)) && (PathPrefix(`/api`) || PathPrefix(`/notifications`) || PathPrefix(`/user-orders`) || PathPrefix(`/order-chart`) || PathPrefix(`/sessions`))"
      - "traefik.http.routers.api-gateway-path.entrypoints=web,websecure"
      - "traefik.http.routers.api-gateway-path.middlewares=sec-headers,compress,rate-limit,retry"
      - "traefik.http.routers.api-gateway-path.service=api-gateway"
      - "traefik.http.routers.api-gateway-path.priority=100"
      # Real-Time WebSocket Router with Session Affinity for Horizontal Scaling
      - "traefik.http.routers.api-gateway-ws.rule=(Host(`${API_DOMAIN:-api.localhost}`) || Host(`${DOMAIN:-localhost}`) || Host(`${CLIENT_DOMAIN:-shop.localhost}`) || Host(`${STORE_DOMAIN:-larekmart.localhost}`) || Host(`${ADMIN_DOMAIN:-admin.localhost}`)) && PathPrefix(`/ws`)"
      - "traefik.http.routers.api-gateway-ws.entrypoints=web,websecure"
      - "traefik.http.routers.api-gateway-ws.service=api-gateway-ws-svc"
      - "traefik.http.routers.api-gateway-ws.priority=120"
      - "traefik.http.services.api-gateway-ws-svc.loadbalancer.server.port=8090"
      - "traefik.http.services.api-gateway-ws-svc.loadbalancer.sticky.cookie=true"
      - "traefik.http.services.api-gateway-ws-svc.loadbalancer.sticky.cookie.name=lm_ws_affinity"
      - "traefik.http.services.api-gateway-ws-svc.loadbalancer.sticky.cookie.httpOnly=true"
      - "traefik.http.services.api-gateway-ws-svc.loadbalancer.sticky.cookie.sameSite=lax"

  # ============================================================================
  # Frontends (Storefront & Admin)
  # ============================================================================

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_API_GATEWAY_URL: ${NEXT_PUBLIC_API_GATEWAY_URL:-}
    container_name: larekmart-client
    deploy: *heavy-deploy
    restart: unless-stopped
    ports:
      - "${CLIENT_BIND_IP:-127.0.0.1}:${CLIENT_PORT:-3002}:3002"
    env_file:
      - ./apps/client/.env
    environment:
      CLIENT_API_GATEWAY_URL: ${CLIENT_API_GATEWAY_URL:-http://api-gateway:8080}
      CLIENT_WS_URL: ${CLIENT_WS_URL:-ws://api-gateway:8080/ws}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:3002/ || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - larekmart-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=larekmart-network"
      - "traefik.http.routers.client.rule=Host(`${CLIENT_DOMAIN:-shop.localhost}`) || Host(`${STORE_DOMAIN:-larekmart.localhost}`) || Host(`localhost`)"
      - "traefik.http.routers.client.entrypoints=web,websecure"
      - "traefik.http.routers.client.middlewares=sec-headers,compress"
      - "traefik.http.routers.client.priority=50"
      - "traefik.http.services.client.loadbalancer.server.port=3002"
      - "traefik.http.services.client.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.client.loadbalancer.healthcheck.interval=15s"

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_API_GATEWAY_URL: ${NEXT_PUBLIC_API_GATEWAY_URL:-}
    container_name: larekmart-admin
    deploy: *heavy-deploy
    restart: unless-stopped
    ports:
      - "${ADMIN_BIND_IP:-127.0.0.1}:${ADMIN_PORT:-3003}:3003"
    env_file:
      - ./apps/admin/.env
    environment:
      ADMIN_API_GATEWAY_URL: ${ADMIN_API_GATEWAY_URL:-http://api-gateway:8080}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:3003/ || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - larekmart-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=larekmart-network"
      - "traefik.http.routers.admin.rule=Host(`${ADMIN_DOMAIN:-admin.localhost}`)"
      - "traefik.http.routers.admin.entrypoints=web,websecure"
      - "traefik.http.routers.admin.middlewares=sec-headers,compress"
      - "traefik.http.routers.admin.priority=60"
      - "traefik.http.services.admin.loadbalancer.server.port=3003"
      - "traefik.http.services.admin.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.admin.loadbalancer.healthcheck.interval=15s"

