name: larekmart

# ============================================================================
# Modular Compose Includes:
#   - Observability: Prometheus Metrics, Grafana Dashboards & Loki Logs
#   - Security: Trivy Container & Dependency Vulnerability Scanning
#   - Rootprint: Log Analytics & Distributed Search (Quickwit + MinIO)
#   - Traefik: Edge Routing, Ingress Proxy & Automated Let's Encrypt TLS
#   - Dozzle: Live Real-Time Container Log Viewer & Nginx Reverse Proxy
#   - Caddy: HTTP/2 & HTTP/3 Reverse Proxy with Compression
# Binds all infrastructure, security, observability, routing, and analytics
# into the primary Larekmart runtime via the unified `larekmart-network`.
# ============================================================================
include:
  - path: docker-compose.observability.yml
  - path: docker-compose.security.yml
  - path: docker-compose.rootprint.yml
  - path: docker-compose.traefik.yml
  - path: docker-compose.dozzle.yml
  - path: docker-compose.caddy.yml

services:
  # ============================================================================
  # Core Infrastructure
  # ============================================================================

  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: larekmart-postgres
    restart: unless-stopped
    ports:
      - "${DB_BIND_IP:-127.0.0.1}:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-product_db}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES:-product_db,inventory_db,catalog_db,shipping_db,analytics_db,notification_db,recommendation_db,user_db,media_db,review_db,wishlist_db,promotion_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - larekmart-network

  mysql:
    build:
      context: ./docker/mysql
      dockerfile: Dockerfile
    container_name: larekmart-mysql
    restart: unless-stopped
    ports:
      - "${DB_BIND_IP:-127.0.0.1}:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysql_root_password_123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tax_db}
      MYSQL_MULTIPLE_DATABASES: ${MYSQL_MULTIPLE_DATABASES:-tax_db}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD:-mysql_root_password_123}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - larekmart-network

  mongo:
    build:
      context: ./docker/mongodb
      dockerfile: Dockerfile
    container_name: larekmart-mongo
    restart: unless-stopped
    ports:
      - "${DB_BIND_IP:-127.0.0.1}:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-example}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh -u $${MONGO_INITDB_ROOT_USERNAME:-root} -p $${MONGO_INITDB_ROOT_PASSWORD:-example} --authenticationDatabase admin --quiet --eval "db.adminCommand(''ping'')" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - larekmart-network

  mongo-express:
    image: mongo-express:1.0.2
    container_name: larekmart-mongo-express
    restart: unless-stopped
    ports:
      - "${DEV_TOOLS_BIND_IP:-127.0.0.1}:8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-root}:${MONGO_INITDB_ROOT_PASSWORD:-example}@mongo:27017/
      ME_CONFIG_BASICAUTH_ENABLED: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME:-mongoexpressuser}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD:-mongoexpresspass}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - larekmart-network

  redis:
    build:
      context: ./docker/redis
      dockerfile: Dockerfile
    container_name: larekmart-redis
    restart: unless-stopped
    ports:
      - "${DB_BIND_IP:-127.0.0.1}:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - larekmart-network

  kafka:
    build:
      context: ./docker/kafka
      dockerfile: Dockerfile
    container_name: larekmart-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_BIND_IP:-127.0.0.1}:9092:9092"
      - "${KAFKA_BIND_IP:-127.0.0.1}:9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - larekmart-network

  opensearch:
    build:
      context: ./docker/opensearch
      dockerfile: Dockerfile
    container_name: larekmart-opensearch
    restart: unless-stopped
    ports:
      - "${DB_BIND_IP:-127.0.0.1}:9200:9200"
      - "${DB_BIND_IP:-127.0.0.1}:9600:9600"
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch
      - discovery.type=single-node
      - bootstrap.memory_lock=false
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_SECURITY_PLUGIN=true"
      - "DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI=true"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-SecurePassword123!}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - larekmart-network

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: larekmart-kafka-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: larekmart-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_READONLY: "false"
      KAFKA_CLUSTERS_0_TOPIC_AUTO_CREATE: "true"
    depends_on:
      kafka:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=larekmart-network"
      - "traefik.http.routers.kafka-ui.rule=Host(`${KAFKA_UI_DOMAIN:-kafka.localhost}`)"
      - "traefik.http.routers.kafka-ui.entrypoints=web,websecure"
      - "traefik.http.services.kafka-ui.loadbalancer.server.port=8080"
    networks:
      - larekmart-network

  # ============================================================================
  # Shared Base Build Images
  # ============================================================================

  base-node:
    build:
      context: .
      dockerfile: docker/base-node/Dockerfile
    image: larekmart-base-node:latest
    pull_policy: build
    container_name: larekmart-base-node
    restart: "no"
    entrypoint: ["echo", "larekmart-base-node build image ready"]

  # ============================================================================
  # Microservices
  # ============================================================================

  product-service:
    build:
      context: .
      dockerfile: apps/product-service/Dockerfile
    container_name: larekmart-product-service
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      - "${INTERNAL_SERVICE_BIND_IP:-127.0.0.1}:8000:8000"
    env_file:
      - ./apps/product-service/.env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8000/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks:
      - larekmart-network

  order-service:
