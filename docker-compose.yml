name: larekmart

# ============================================================================
# Modular Compose Includes:
#   - Observability: Prometheus Metrics, Grafana Dashboards & Loki Logs
#   - Security: Trivy Container & Dependency Vulnerability Scanning
#   - Rootprint: Log Analytics & Distributed Search (Quickwit + MinIO)
#   - Traefik: Edge Routing, Ingress Proxy & Automated Let's Encrypt TLS
#   - Dozzle: Live Real-Time Container Log Viewer & Nginx Reverse Proxy
#   - Caddy: HTTP/2 & HTTP/3 Reverse Proxy with Compression
# Binds all infrastructure, security, observability, routing, and analytics
# into the primary Larekmart runtime via the unified `larekmart-network`.
# ============================================================================
include:
  - path: docker-compose.observability.yml
  - path: docker-compose.security.yml
  - path: docker-compose.rootprint.yml
  - path: docker-compose.traefik.yml
  - path: docker-compose.dozzle.yml
  - path: docker-compose.caddy.yml

# ============================================================================
# Reusable Deploy Resource Profiles (Anti-Starvation Limits & Reservations)
# ============================================================================
x-microservice-deploy: &microservice-deploy
  resources:
    limits:
      cpus: "0.50"
      memory: 512M
    reservations:
      cpus: "0.10"
      memory: 128M

x-heavy-deploy: &heavy-deploy
  resources:
    limits:
      cpus: "1.00"
      memory: 1024M
    reservations:
      cpus: "0.20"
      memory: 256M

x-database-deploy: &database-deploy
  resources:
    limits:
      cpus: "1.50"
      memory: 1536M
    reservations:
      cpus: "0.25"
      memory: 512M

x-search-deploy: &search-deploy
  resources:
    limits:
      cpus: "0.75"
      memory: 768M
    reservations:
      cpus: "0.15"
      memory: 256M

x-light-deploy: &light-deploy
  resources:
    limits:
      cpus: "0.25"
      memory: 256M
    reservations:
      cpus: "0.05"
      memory: 64M

x-cache-deploy: &cache-deploy
  resources:
    limits:
      cpus: "0.50"
      memory: 512M
    reservations:
      cpus: "0.10"
      memory: 128M

services:
  # ============================================================================
  # Core Infrastructure
  # ============================================================================

  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: larekmart-postgres
    deploy: *database-deploy
    restart: unless-stopped
    ports:
      - "${DB_BIND_IP:-127.0.0.1}:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-product_db}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES:-product_db,inventory_db,catalog_db,shipping_db,notification_db,recommendation_db,user_db,media_db,review_db,wishlist_db,promotion_db,pricing_db,vendor_db,seller_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      larekmart-network:
        aliases:
          - postgres-replica

  pgbouncer:
    build:
      context: ./docker/pgbouncer
      dockerfile: Dockerfile
    container_name: larekmart-pgbouncer
    deploy: *light-deploy
    restart: unless-stopped
    ports:
      - "${PGBOUNCER_BIND_IP:-127.0.0.1}:6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - larekmart-network

  postgres-analytics:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: larekmart-postgres-analytics
    deploy: *search-deploy
    restart: unless-stopped
    ports:
      - "${ANALYTICS_DB_BIND_IP:-127.0.0.1}:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_ANALYTICS_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ANALYTICS_PASSWORD:-password123}
      POSTGRES_DB: analytics_db
    volumes:
      - postgres_analytics_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_ANALYTICS_USER:-postgres} -d analytics_db",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - larekmart-network

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: larekmart-clickhouse
    deploy: *search-deploy
    restart: unless-stopped
    ports:
      - "${CLICKHOUSE_HTTP_BIND_IP:-127.0.0.1}:8123:8123"
      - "${CLICKHOUSE_TCP_BIND_IP:-127.0.0.1}:9000:9000"
    environment:
      CLICKHOUSE_DB: analytics_db
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse123}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      kafka:
        condition: service_healthy
      kafka-broker-2:
        condition: service_healthy
      kafka-broker-3:
        condition: service_healthy
    networks:
      - larekmart-network

  mysql:
    build:
      context: ./docker/mysql
      dockerfile: Dockerfile
    container_name: larekmart-mysql
    deploy: *search-deploy
    restart: unless-stopped
    ports:
      - "${DB_BIND_IP:-127.0.0.1}:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysql_root_password_123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tax_db}
      MYSQL_MULTIPLE_DATABASES: ${MYSQL_MULTIPLE_DATABASES:-tax_db}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p$${MYSQL_ROOT_PASSWORD:-mysql_root_password_123}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - larekmart-network

  mysql-returns:
    build:
      context: ./docker/mysql
      dockerfile: Dockerfile
    container_name: larekmart-mysql-returns
    deploy: *search-deploy
    restart: unless-stopped
    ports:
      - "${RETURNS_DB_BIND_IP:-127.0.0.1}:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_RETURNS_ROOT_PASSWORD:-mysql_root_password_123}
      MYSQL_DATABASE: return_db
    volumes:
      - mysql_returns_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p$${MYSQL_RETURNS_ROOT_PASSWORD:-mysql_root_password_123}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - larekmart-network

  mongo:
    build:
      context: ./docker/mongodb
      dockerfile: Dockerfile
    container_name: larekmart-mongo
    deploy: *heavy-deploy
    restart: unless-stopped
    ports:
      - "${DB_BIND_IP:-127.0.0.1}:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-example}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh -u $${MONGO_INITDB_ROOT_USERNAME:-root} -p $${MONGO_INITDB_ROOT_PASSWORD:-example} --authenticationDatabase admin --quiet --eval "db.adminCommand(''ping'')" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - larekmart-network

  mongo-express:
    image: mongo-express:1.0.2
    container_name: larekmart-mongo-express
    deploy: *light-deploy
    restart: unless-stopped
    ports:
      - "${DEV_TOOLS_BIND_IP:-127.0.0.1}:8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-root}:${MONGO_INITDB_ROOT_PASSWORD:-example}@mongo:27017/
      ME_CONFIG_BASICAUTH_ENABLED: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME:-mongoexpressuser}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD:-mongoexpresspass}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - larekmart-network

  redis:
    build:
      context: ./docker/redis
      dockerfile: Dockerfile
    container_name: larekmart-redis
    deploy: *cache-deploy
    restart: unless-stopped
    ports:
      - "${DB_BIND_IP:-127.0.0.1}:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - larekmart-network

  kafka:
    build:
      context: ./docker/kafka
      dockerfile: Dockerfile
    container_name: larekmart-kafka-broker-1
    hostname: kafka-broker-1
    deploy: *heavy-deploy
    restart: unless-stopped
    ports:
      - "${KAFKA_BIND_IP:-127.0.0.1}:9092:9092"
      - "${KAFKA_BIND_IP:-127.0.0.1}:9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-broker-1:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker-1:9093,2@kafka-broker-2:9093,3@kafka-broker-3:9093
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_broker_1_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      larekmart-network:
        aliases:
          - kafka-broker-1
          - kafka

  kafka-broker-2:
    build:
      context: ./docker/kafka
      dockerfile: Dockerfile
    container_name: larekmart-kafka-broker-2
    hostname: kafka-broker-2
    deploy: *heavy-deploy
    restart: unless-stopped
    ports:
      - "${KAFKA_BIND_IP:-127.0.0.1}:9095:9095"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9095
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-broker-2:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker-1:9093,2@kafka-broker-2:9093,3@kafka-broker-3:9093
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_broker_2_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      larekmart-network:
        aliases:
          - kafka-broker-2

  kafka-broker-3:
    build:
      context: ./docker/kafka
      dockerfile: Dockerfile
    container_name: larekmart-kafka-broker-3
    hostname: kafka-broker-3
    deploy: *heavy-deploy
    restart: unless-stopped
    ports:
      - "${KAFKA_BIND_IP:-127.0.0.1}:9096:9096"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9096
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-broker-3:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9096
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker-1:9093,2@kafka-broker-2:9093,3@kafka-broker-3:9093
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_broker_3_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      larekmart-network:
        aliases:
          - kafka-broker-3

  opensearch:
    build:
      context: ./docker/opensearch
      dockerfile: Dockerfile
    container_name: larekmart-opensearch
    deploy: *database-deploy
    restart: unless-stopped
    ports:
      - "${DB_BIND_IP:-127.0.0.1}:9200:9200"
      - "${DB_BIND_IP:-127.0.0.1}:9600:9600"
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch
      - discovery.type=single-node
      - bootstrap.memory_lock=false
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_SECURITY_PLUGIN=true"
      - "DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI=true"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-SecurePassword123!}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - larekmart-network

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: larekmart-kafka-ui
    deploy: *cache-deploy
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: larekmart-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker-1:9092,kafka-broker-2:9092,kafka-broker-3:9092
      KAFKA_CLUSTERS_0_READONLY: "false"
      KAFKA_CLUSTERS_0_TOPIC_AUTO_CREATE: "true"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-broker-2:
        condition: service_healthy
      kafka-broker-3:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=larekmart-network"
      - "traefik.http.routers.kafka-ui.rule=Host(`${KAFKA_UI_DOMAIN:-kafka.localhost}`)"
      - "traefik.http.routers.kafka-ui.entrypoints=web,websecure"
      - "traefik.http.services.kafka-ui.loadbalancer.server.port=8080"
    networks:
      - larekmart-network

  # ============================================================================
  # Shared Base Build Images
  # ============================================================================

  base-node:
    build:
      context: .
      dockerfile: docker/base-node/Dockerfile
    image: larekmart-base-node:latest
    pull_policy: build
    container_name: larekmart-base-node
    restart: "no"
    entrypoint: ["echo", "larekmart-base-node build image ready"]

  # ============================================================================
  # Microservices
  # ============================================================================

  product-service:
    build:
      context: .
      dockerfile: apps/product-service/Dockerfile
    container_name: larekmart-product-service
    deploy: *microservice-deploy
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      - "${INTERNAL_SERVICE_BIND_IP:-127.0.0.1}:8000:8000"
    env_file:
      - ./apps/product-service/.env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8000/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks:
      - larekmart-network

  order-service:
    build:
      context: .
      dockerfile: apps/order-service/Dockerfile
    container_name: larekmart-order-service
    deploy: *microservice-deploy
    restart: unless-stopped
    expose:
      - "8001"
    ports:
      - "${INTERNAL_SERVICE_BIND_IP:-127.0.0.1}:8001:8001"
    env_file:
      - ./apps/order-service/.env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8001/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - larekmart-network

  payment-service:
    build:
      context: .
      dockerfile: apps/payment-service/Dockerfile
    container_name: larekmart-payment-service
    deploy: *microservice-deploy
    restart: unless-stopped
    expose:
      - "8002"
    ports:
      - "${INTERNAL_SERVICE_BIND_IP:-127.0.0.1}:8002:8002"
    env_file:
      - ./apps/payment-service/.env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8002/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - larekmart-network

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    container_name: larekmart-auth-service
    deploy: *microservice-deploy
    restart: unless-stopped
    expose:
      - "8003"
    ports:
      - "${INTERNAL_SERVICE_BIND_IP:-127.0.0.1}:8003:8003"
    env_file:
      - ./apps/auth-service/.env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8003/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - larekmart-network

  analytic-service:
    build:
      context: ./apps/analytic-service
      dockerfile: Dockerfile
    container_name: larekmart-analytic-service
    deploy: *microservice-deploy
    restart: unless-stopped
    expose:
      - "8004"
    ports:
      - "${INTERNAL_SERVICE_BIND_IP:-127.0.0.1}:8004:8004"
    environment:
      - "DATABASE_URL=postgresql://${POSTGRES_ANALYTICS_USER:-postgres}:${POSTGRES_ANALYTICS_PASSWORD:-password123}@postgres-analytics:5432/analytics_db?sslmode=disable"
      - "REDIS_URL=redis://redis:6379"
      - "REDIS_KEY_PREFIX=analytics:v1:"
      - "KAFKA_BROKERS=kafka-broker-1:9092,kafka-broker-2:9092,kafka-broker-3:9092"
      - "KAFKA_GROUP_ID=analytic-service-group"
      - "ANALYTICS_BATCH_SIZE=1000"
      - "ANALYTICS_FLUSH_INTERVAL_MS=500"
      - "ANALYTICS_QUEUE_CAPACITY=10000"
      - "ANALYTICS_WORKER_COUNT=4"
      - "APP_ENV=production"
      - "PORT=8004"
      - "CLIENT_URL=${CLIENT_URL:-http://localhost:3002}"
      - "ADMIN_URL=${ADMIN_URL:-http://localhost:3003}"
      - "INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-dev-shared-internal-secret-larekmart}"
      - "CLICKHOUSE_URL=http://${CLICKHOUSE_USER:-default}:${CLICKHOUSE_PASSWORD:-clickhouse123}@clickhouse:8123/analytics_db"
      - "CLICKHOUSE_ENABLED=true"
    env_file:
      - ./apps/analytic-service/.env
    healthcheck:
