---
# Kubernetes Node-Specific Variables
k8s_version: "1.30"
containerd_version: "1.7.18"
cni_plugins_version: "1.5.0"

# Kernel modules required by Kubernetes
k8s_kernel_modules:
  - overlay
  - br_netfilter

# Sysctl parameters required by K8s CNI and bridge filter
k8s_sysctl_settings:
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
  net.ipv4.ip_forward: 1

# Swap must be disabled on all Kubernetes nodes
disable_swap: true
