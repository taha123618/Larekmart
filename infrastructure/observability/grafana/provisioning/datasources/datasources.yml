apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 5000
  - name: Quickwit
    type: elasticsearch
    access: proxy
    url: http://quickwit:7280/api/v1
    isDefault: false
    editable: false
    jsonData:
      esVersion: "7.10.0"
      timeField: "timestamp"
