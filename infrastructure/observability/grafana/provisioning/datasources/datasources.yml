apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 5000
      derivedFields:
        - datasourceUid: "tempo"
          matcherRegex: '"traceId":"([a-fA-F0-9]+)"'
          name: TraceID
          url: "$${__value.raw}"

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: false
    jsonData:
      httpMethod: GET
      tracesToLogsV2:
        datasourceUid: "loki"
        spanStartTimeShift: "1h"
        spanEndTimeShift: "1h"
        filterByTraceId: false
        filterBySpanId: false
        customQuery: true
        query: '{$${__tags}} | json | traceId = "$${__trace.id}"'
      lokiSearch:
        datasourceUid: "loki"
      nodeGraph:
        enabled: true
      search:
        hide: false

  - name: Quickwit
    type: elasticsearch
    access: proxy
    url: http://quickwit:7280/api/v1
    isDefault: false
    editable: false
    jsonData:
      esVersion: "7.10.0"
      timeField: "timestamp"
