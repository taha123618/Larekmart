apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: falco
  namespace: monitoring
  labels:
    app.kubernetes.io/name: falco
    app.kubernetes.io/part-of: larekmart-observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: falco
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falco
    spec:
      serviceAccountName: falco
      hostNetwork: true
      hostPID: true
      tolerations:
        - key: node-role.kubernetes.io/master
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      containers:
        - name: falco
          image: falcosecurity/falco-no-driver:0.38.0
          securityContext:
            privileged: true
          args:
            - /usr/bin/falco
            - -K
            - /var/run/secrets/kubernetes.io/serviceaccount/token
            - -k
            - https://kubernetes.default.svc
            - -pk
          env:
            - name: FALCO_BPF_PROBE
              value: ""
          volumeMounts:
            - mountPath: /etc/falco/rules.d
              name: rules-volume
            - mountPath: /host/proc
              name: proc-fs
              readOnly: true
            - mountPath: /host/dev
              name: dev-fs
              readOnly: true
            - mountPath: /var/run/docker.sock
              name: docker-sock
              readOnly: true
      volumes:
        - name: rules-volume
          configMap:
            name: falco-rules
        - name: proc-fs
          hostPath:
            path: /proc
        - name: dev-fs
          hostPath:
            path: /dev
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
