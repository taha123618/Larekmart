global:
  resolve_timeout: 5m
  slack_api_url: "https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX"  # Set your Slack Webhook URL here

route:
  group_by: ["alertname", "service", "namespace"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default-receiver

  routes:
    - match:
        severity: critical
      receiver: pagerduty-critical
      continue: true

    - match:
        severity: critical
      receiver: slack-critical

    - match:
        severity: warning
      receiver: slack-warnings

receivers:
  - name: default-receiver
    slack_configs:
      - channel: "#larekmart-alerts"
        title: "{{ .GroupLabels.alertname }}"
        text: |
          *Alert:* {{ .GroupLabels.alertname }}
          *Severity:* {{ .CommonLabels.severity }}
          {{ range .Alerts }}
          *Description:* {{ .Annotations.description }}
          *Runbook:* https://docs.larekmart.com/runbooks/{{ .Labels.alertname }}
          {{ end }}
        send_resolved: true

  - name: slack-critical
    slack_configs:
      - channel: "#larekmart-critical"
        title: "🔴 CRITICAL: {{ .GroupLabels.alertname }}"
        text: |
          {{ range .Alerts }}
          *Service:* {{ .Labels.service }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
        send_resolved: true

  - name: slack-warnings
    slack_configs:
      - channel: "#larekmart-alerts"
        title: "⚠️ WARNING: {{ .GroupLabels.alertname }}"
        text: |
          {{ range .Alerts }}
          *Summary:* {{ .Annotations.summary }}
          {{ end }}
        send_resolved: true

  - name: pagerduty-critical
    pagerduty_configs:
      - routing_key: "${PAGERDUTY_INTEGRATION_KEY}"
        description: |
          {{ .GroupLabels.alertname }}
          {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}
        severity: critical

inhibit_rules:
  # Suppress downstream alerts when the whole service is down
  - source_match:
      alertname: ServiceDown
    target_match_re:
      alertname: "HighErrorRate|HighLatencyP99"
    equal: ["service"]

  # Suppress node-level warnings when node has critical resources
  - source_match:
      severity: critical
      alertname: LowMemoryAvailable
    target_match:
      severity: warning
      alertname: HighCPUUsage
    equal: ["instance"]
