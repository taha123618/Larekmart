server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ──────────────────────────────────────────
  # Docker daemon container log discovery — the single scrape job.
  # All Larekmart services log to stdout/stderr (json-file driver);
  # Promtail discovers every container via /var/run/docker.sock.
  # The file-glob job and the /var/log/larekmart jobs were removed:
  # no service sets logging.options.tag and nothing writes those files,
  # so they registered targets but could never emit labeled streams.
  # ──────────────────────────────────────────
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Exclude the observability stack's own containers
      - source_labels:
          ["__meta_docker_container_label_com_docker_compose_service"]
        regex: "grafana|loki|promtail"
        action: drop
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels:
          ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "service"
      - source_labels:
          ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: "project"
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "stream"
      - target_label: "job"
        replacement: "larekmart"
