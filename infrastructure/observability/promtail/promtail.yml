server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ──────────────────────────────────────────
  # Dynamic Docker daemon container log discovery (Production)
  # Queries /var/run/docker.sock to auto-discover and label all container logs
  # ──────────────────────────────────────────
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "stream"

  # ──────────────────────────────────────────
  # Docker container log collection
  # ──────────────────────────────────────────
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker-logs
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs: attrs

      - json:
          source: attrs
          expressions:
            tag: tag

      - regex:
          source: tag
          expression: "^(?P<image_name>(?:[^|]*[^|]))?(?:|)(?P<container_name>(?:[^|]*[^|]))?(?:|)(?P<image_id>(?:[^|]*[^|]))?(?:|)(?P<container_id>[^|]*)$"
      - labels:
          stream:
          image_name:
          container_name:
          
      - output:
          source: output

  # ──────────────────────────────────────────
  # Larekmart Microservice log paths (when running on host, e.g. dev)
  # ──────────────────────────────────────────
  - job_name: product-service
    static_configs:
      - targets: ["localhost"]
        labels:
          job: product-service
          service: product-service
          __path__: /var/log/larekmart/product-service.log

  - job_name: order-service
    static_configs:
      - targets: ["localhost"]
        labels:
          job: order-service
          service: order-service
          __path__: /var/log/larekmart/order-service.log

  - job_name: cart-service
    static_configs:
      - targets: ["localhost"]
        labels:
          job: cart-service
          service: cart-service
          __path__: /var/log/larekmart/cart-service.log
