# ==============================================================================
# OpenTelemetry Collector Configuration — Larekmart Observability
# ==============================================================================
# Ingests OTLP telemetry (traces, metrics, logs) from distributed microservices,
# processes them (batching, memory safeguards), and routes to monitoring backends:
# - Traces: Batch processed and emitted to stdout/debug (and forwardable to Tempo/Jaeger)
# - Metrics: Emitted via Prometheus scraper exporter on :8889
# - Logs: Correlated and emitted for inspection
# ==============================================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 256
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

exporters:
  debug:
    verbosity: basic
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: larekmart

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888
