  - job_name: media-service
    metrics_path: /metrics
    static_configs:
      - targets: ["media-service:8013"]
        labels:
          service: media-service
          runtime: nodejs

  - job_name: review-service
    metrics_path: /metrics
    static_configs:
      - targets: ["review-service:8014"]
        labels:
          service: review-service
          runtime: nodejs

  - job_name: wishlist-service
    metrics_path: /metrics
    static_configs:
      - targets: ["wishlist-service:8015"]
