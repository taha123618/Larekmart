global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: larekmart-local
    environment: development

rule_files:
  - "/etc/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # ──────────────────────────────────────────
  # Self-monitoring
  # ──────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ──────────────────────────────────────────
  # Infrastructure
  # ──────────────────────────────────────────
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: mongodb
    static_configs:
      - targets: ["mongodb-exporter:9216"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: opensearch
    metrics_path: /_prometheus/metrics
    static_configs:
      - targets: ["opensearch:9200"]

  - job_name: clickhouse
    metrics_path: /metrics
    static_configs:
      - targets: ["clickhouse:8123"]
        labels:
          component: columnar-analytics

  - job_name: cadvisor
    metrics_path: /metrics
    static_configs:
      - targets: ["cadvisor:8087"]
        labels:
          component: container-metrics

  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          component: otel-collector

  # ──────────────────────────────────────────
  # Node.js / TypeScript microservices
  # These expose /metrics via @repo/monitoring
  # ──────────────────────────────────────────
  - job_name: product-service
    metrics_path: /metrics
    static_configs:
      - targets: ["product-service:8000"]
        labels:
          service: product-service
          runtime: nodejs

  - job_name: order-service
    metrics_path: /metrics
    static_configs:
      - targets: ["order-service:8001"]
        labels:
          service: order-service
          runtime: nodejs

  - job_name: payment-service
    metrics_path: /metrics
    static_configs:
      - targets: ["payment-service:8002"]
        labels:
          service: payment-service
          runtime: nodejs

  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-service:8003"]
        labels:
          service: auth-service
          runtime: nodejs

  - job_name: analytic-service
    metrics_path: /metrics
    static_configs:
      - targets: ["analytic-service:8004"]
        labels:
          service: analytic-service
          runtime: go

  - job_name: notification-service
    metrics_path: /metrics
    static_configs:
      - targets: ["notification-service:8005"]
        labels:
          service: notification-service
          runtime: go

  - job_name: search-service
    metrics_path: /metrics
    static_configs:
      - targets: ["search-service:8006"]
        labels:
          service: search-service
          runtime: nodejs

  - job_name: inventory-service
    metrics_path: /metrics
    static_configs:
      - targets: ["inventory-service:8007"]
        labels:
          service: inventory-service
          runtime: nodejs

  - job_name: recommendation-service
    metrics_path: /metrics
    static_configs:
      - targets: ["recommendation-service:8008"]
        labels:
          service: recommendation-service
          runtime: python

  - job_name: cart-service
    metrics_path: /metrics
    static_configs:
      - targets: ["cart-service:8009"]
        labels:
          service: cart-service
          runtime: nodejs

  - job_name: catalog-service
    metrics_path: /metrics
    static_configs:
      - targets: ["catalog-service:8010"]
        labels:
          service: catalog-service
          runtime: nodejs

  - job_name: shipping-service
    metrics_path: /metrics
    static_configs:
      - targets: ["shipping-service:8011"]
        labels:
          service: shipping-service
