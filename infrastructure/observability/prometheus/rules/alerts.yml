groups:
  # ══════════════════════════════════════════════════════
  # SERVICE AVAILABILITY
  # ══════════════════════════════════════════════════════
  - name: service_availability
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is DOWN"
          description: |
            The service {{ $labels.job }} on {{ $labels.instance }} has been unreachable for more than 1 minute.
            Possible causes: container crash, OOM, misconfigured health check.
            Remediation: check `kubectl logs` and pod restart count. Verify health endpoint.

      - alert: HighErrorRate
        expr: |
          (
            rate(http_requests_total{status=~"5.."}[5m])
            /
            rate(http_requests_total[5m])
          ) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx error rate on {{ $labels.service }}"
          description: |
            {{ $labels.service }} is returning 5xx errors at {{ $value | humanizePercentage }} for 2+ minutes.
            Remediation: inspect application logs, check downstream dependencies.

      - alert: HighLatencyP99
        expr: |
          histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "P99 latency above 2s on {{ $labels.service }}"
          description: |
            99th-percentile request latency for {{ $labels.service }} is {{ $value | humanizeDuration }}.
            Possible causes: slow DB query, cache miss, upstream service degradation, resource exhaustion.

  # ══════════════════════════════════════════════════════
  # KUBERNETES POD HEALTH
  # ══════════════════════════════════════════════════════
  - name: kubernetes_pods
    rules:
      - alert: PodCrashLooping
        expr: |
          increase(kube_pod_container_status_restarts_total[15m]) > 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.pod }} in {{ $labels.namespace }} is crash-looping"
          description: |
            Pod {{ $labels.pod }} has restarted {{ $value }} times in 15 minutes.
            Remediation: run `kubectl describe pod {{ $labels.pod }} -n {{ $labels.namespace }}` and check events/logs.

      - alert: PodNotReady
        expr: |
          kube_pod_status_ready{condition="false"} == 1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.pod }} not ready"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been in a not-ready state for 3 minutes."

      - alert: DeploymentReplicasMismatch
        expr: |
          kube_deployment_spec_replicas != kube_deployment_status_replicas_available
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Deployment {{ $labels.deployment }} replica mismatch"
          description: "Expected {{ $value }} replicas but availability differs. Check pod events."

  # ══════════════════════════════════════════════════════
  # NODE & INFRASTRUCTURE RESOURCES
  # ══════════════════════════════════════════════════════
  - name: node_resources
    rules:
      - alert: HighCPUUsage
        expr: |
          (1 - avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU on {{ $labels.instance }}: {{ $value | humanize }}%"
          description: "CPU usage has been above 90% for 5+ minutes. Consider scaling."

      - alert: LowMemoryAvailable
        expr: |
          (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Low memory on {{ $labels.instance }}: {{ $value | humanize }}% available"
          description: "Available memory is below 10%. Risk of OOM kills."

      - alert: DiskSpaceRunningLow
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space low on {{ $labels.instance }} ({{ $labels.mountpoint }})"
          description: "Only {{ $value | humanize }}% disk space remaining."

      - alert: DiskSpaceCritical
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes) * 100 < 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL: Disk nearly full on {{ $labels.instance }}"
          description: "Less than 5% disk available. Immediate action required."

  # ══════════════════════════════════════════════════════
  # DATABASE & DATA STORES
  # ══════════════════════════════════════════════════════
  - name: databases
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is DOWN"
          description: "PostgreSQL exporter cannot connect. All SQL-backed services affected."

      - alert: PostgresConnectionsNearLimit
        expr: |
          (pg_stat_activity_count / pg_settings_max_connections) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections at {{ $value | humanizePercentage }} of limit"
          description: "Connection pool near saturation. Review PgBouncer / connection limits."

      - alert: MongoDBDown
        expr: mongodb_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MongoDB is DOWN"
          description: "MongoDB exporter cannot connect. Order service and cart service affected."

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is DOWN"
          description: "Redis is unreachable. Cart, recommendation caching, and session state will degrade."

      - alert: RedisMemoryUsageHigh
        expr: |
          (redis_memory_used_bytes / redis_memory_max_bytes) > 0.90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory at {{ $value | humanizePercentage }}"
          description: "Redis is near the memory limit. Evictions may start and cached data may be lost."

  # ══════════════════════════════════════════════════════
  # KAFKA
  # ══════════════════════════════════════════════════════
  - name: kafka
    rules:
      - alert: KafkaConsumerLag
        expr: kafka_consumergroup_lag_sum > 5000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag: {{ $value }} messages behind on {{ $labels.topic }}"
          description: "Consumer group {{ $labels.consumergroup }} is significantly behind. Check email, notification, or analytic service consumers."

      - alert: KafkaBrokerDown
        expr: kafka_brokers < 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Kafka broker count dropped to {{ $value }}"
          description: "No Kafka brokers available. All async event processing is halted."
