groups:
  # ══════════════════════════════════════════════════════
  # SERVICE AVAILABILITY
  # ══════════════════════════════════════════════════════
  - name: service_availability
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is DOWN"
          description: |
            The service {{ $labels.job }} on {{ $labels.instance }} has been unreachable for more than 1 minute.
            Possible causes: container crash, OOM, misconfigured health check.
            Remediation: check `kubectl logs` and pod restart count. Verify health endpoint.

      - alert: HighErrorRate
        expr: |
          (
            rate(http_requests_total{status=~"5.."}[5m])
            /
            rate(http_requests_total[5m])
          ) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx error rate on {{ $labels.service }}"
          description: |
            {{ $labels.service }} is returning 5xx errors at {{ $value | humanizePercentage }} for 2+ minutes.
            Remediation: inspect application logs, check downstream dependencies.

      - alert: HighLatencyP99
        expr: |
          histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "P99 latency above 2s on {{ $labels.service }}"
          description: |
            99th-percentile request latency for {{ $labels.service }} is {{ $value | humanizeDuration }}.
            Possible causes: slow DB query, cache miss, upstream service degradation, resource exhaustion.

  # ══════════════════════════════════════════════════════
  # KUBERNETES POD HEALTH
  # ══════════════════════════════════════════════════════
  - name: kubernetes_pods
    rules:
      - alert: PodCrashLooping
        expr: |
          increase(kube_pod_container_status_restarts_total[15m]) > 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.pod }} in {{ $labels.namespace }} is crash-looping"
          description: |
            Pod {{ $labels.pod }} has restarted {{ $value }} times in 15 minutes.
            Remediation: run `kubectl describe pod {{ $labels.pod }} -n {{ $labels.namespace }}` and check events/logs.

      - alert: PodNotReady
        expr: |
          kube_pod_status_ready{condition="false"} == 1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.pod }} not ready"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been in a not-ready state for 3 minutes."

      - alert: DeploymentReplicasMismatch
        expr: |
          kube_deployment_spec_replicas != kube_deployment_status_replicas_available
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Deployment {{ $labels.deployment }} replica mismatch"
          description: "Expected {{ $value }} replicas but availability differs. Check pod events."

  # ══════════════════════════════════════════════════════
  # NODE & INFRASTRUCTURE RESOURCES
  # ══════════════════════════════════════════════════════
  - name: node_resources
    rules:
      - alert: HighCPUUsage
        expr: |
          (1 - avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU on {{ $labels.instance }}: {{ $value | humanize }}%"
          description: "CPU usage has been above 90% for 5+ minutes. Consider scaling."

      - alert: LowMemoryAvailable
        expr: |
          (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Low memory on {{ $labels.instance }}: {{ $value | humanize }}% available"
          description: "Available memory is below 10%. Risk of OOM kills."

      - alert: DiskSpaceRunningLow
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space low on {{ $labels.instance }} ({{ $labels.mountpoint }})"
          description: "Only {{ $value | humanize }}% disk space remaining."

      - alert: DiskSpaceCritical
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes) * 100 < 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL: Disk nearly full on {{ $labels.instance }}"
          description: "Less than 5% disk available. Immediate action required."

  # ══════════════════════════════════════════════════════
  # DATABASE & DATA STORES
  # ══════════════════════════════════════════════════════
  - name: databases
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is DOWN"
          description: "PostgreSQL exporter cannot connect. All SQL-backed services affected."

      - alert: PostgresConnectionsNearLimit
        expr: |
          (pg_stat_activity_count / pg_settings_max_connections) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections at {{ $value | humanizePercentage }} of limit"
          description: "Connection pool near saturation. Review PgBouncer / connection limits."

      - alert: MongoDBDown
        expr: mongodb_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MongoDB is DOWN"
          description: "MongoDB exporter cannot connect. Order service and cart service affected."

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is DOWN"
          description: "Redis is unreachable. Cart, recommendation caching, and session state will degrade."

      - alert: RedisMemoryUsageHigh
        expr: |
          (redis_memory_used_bytes / redis_memory_max_bytes) > 0.90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory at {{ $value | humanizePercentage }}"
          description: "Redis is near the memory limit. Evictions may start and cached data may be lost."

  # ══════════════════════════════════════════════════════
  # KAFKA
  # ══════════════════════════════════════════════════════
  - name: kafka
    rules:
      - alert: KafkaConsumerLag
        expr: kafka_consumergroup_lag_sum > 5000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag: {{ $value }} messages behind on {{ $labels.topic }}"
          description: "Consumer group {{ $labels.consumergroup }} is significantly behind. Check email, notification, or analytic service consumers."

      - alert: KafkaBrokerDown
        expr: kafka_brokers < 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Kafka broker count dropped to {{ $value }}"
          description: "No Kafka brokers available. All async event processing is halted."

  # ══════════════════════════════════════════════════════
  # CDC (CHANGE DATA CAPTURE) & LOGICAL REPLICATION
  # ══════════════════════════════════════════════════════
  - name: cdc_and_replication
    rules:
      - alert: PostgresReplicationSlotInactive
        expr: pg_replication_slots_active == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL replication slot {{ $labels.slot_name }} is INACTIVE"
          description: |
            Replication slot {{ $labels.slot_name }} on database {{ $labels.datname }} has been inactive for >2m.
            Debezium CDC streaming may be halted and WAL logs will accumulate on disk.
            Remediation: check Debezium server logs (`docker logs debezium-inventory` / `debezium-payout`).

      - alert: PostgresReplicationSlotLagHigh
        expr: pg_replication_slots_wal_bytes_behind > 104857600
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High replication slot WAL lag on {{ $labels.slot_name }} (>100MB)"
          description: |
            Replication slot {{ $labels.slot_name }} is {{ $value | humanize1024 }} bytes behind the WAL flush LSN.
            Possible causes: Debezium connector throttling, Kafka sink latency, or high write throughput.

      - alert: DebeziumServerDown
        expr: up{job=~"debezium.*"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Debezium CDC server {{ $labels.job }} is DOWN"
          description: "Debezium standalone server container is unresponsive. Transactional outbox event streaming is paused."

  # ══════════════════════════════════════════════════════
  # SCHEMA REGISTRY (KARAPACE)
  # ══════════════════════════════════════════════════════
  - name: schema_registry
    rules:
      - alert: SchemaRegistryDown
        expr: up{job="schema-registry"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Karapace Schema Registry is DOWN"
          description: |
            Schema Registry instance on {{ $labels.instance }} is unreachable.
            Kafka producers and consumers requiring wire-format serialization or schema validation will fail.
            Remediation: check Karapace logs (`docker logs schema-registry`) and Kafka connectivity to `_schemas`.

      - alert: SchemaRegistryHighErrorRate
        expr: |
          (
            rate(karapace_requests_total{status=~"5.."}[5m])
            /
            rate(karapace_requests_total[5m])
          ) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate on Schema Registry"
          description: "Schema Registry is failing schema registrations or compatibility checks at {{ $value | humanizePercentage }}."

  # ══════════════════════════════════════════════════════
  # SYNTHETIC CANARY & E2E HEALTH PROBER
  # ══════════════════════════════════════════════════════
  - name: canary_prober
    rules:
      - alert: SyntheticCheckoutProbeFailure
        expr: canary_probe_consecutive_failures{scenario="checkout"} >= 2
        for: 1m
        labels:
          severity: critical
          tier: platform-resilience
        annotations:
          summary: "CRITICAL: Consecutive Synthetic Checkout Probe Failures"
          description: |
            The synthetic checkout probe has failed {{ $value }} consecutive times.
            Critical customer checkout flows (stock reservation, order creation, or payment processing) are failing E2E synthetic verification.
            Remediation: Inspect recent Canary run logs, check inventory-service stock locks, order-service database latency, and payment gateway health.

      - alert: SyntheticReadProbeDegraded
        expr: canary_probe_sla_percentage{scenario="read"} < 95
        for: 3m
        labels:
          severity: warning
          tier: platform-resilience
        annotations:
          summary: "WARNING: Synthetic Read Probe SLA below 95%"
          description: |
            Synthetic read probes (storefront home aggregation, search autocomplete, or edge inventory) have dropped to {{ $value | humanizePercentage }} SLA over the rolling window.
            Remediation: Check OpenSearch cluster health, Redis edge cache hit ratios, and API Gateway upstream response times.

      - alert: SyntheticProbeLatencyHigh
        expr: histogram_quantile(0.95, rate(canary_probe_duration_seconds_bucket[5m])) > 3
        for: 3m
        labels:
          severity: warning
          tier: platform-resilience
        annotations:
          summary: "WARNING: Synthetic Canary P95 Latency > 3s"
          description: |
            Synthetic canary probe 95th-percentile execution latency is currently {{ $value | humanizeDuration }} (exceeds 3.0s SLA).
            Remediation: Check downstream service latency breakdown in Admin Health Dashboard (/system-health).

  # ══════════════════════════════════════════════════════
  # SECURITY & THREAT DETECTION (DEVSECOPS)
  # ══════════════════════════════════════════════════════
  - name: security_threats
    rules:
      - alert: BruteForceAuthenticationDetected
        expr: sum(rate(http_requests_total{status="401"}[2m])) > 20
        for: 1m
        labels:
          severity: critical
          tier: security
        annotations:
          summary: "CRITICAL: Potential Brute-Force or Credential Stuffing Attack"
          description: |
            More than 20 authentication failures (401 Unauthorized) per second detected over 2 minutes.
            Remediation: Inspect API Gateway access logs for source IP distribution, trigger Cloudflare/WAF IP block, and inspect Redis rate limit triggers.

      - alert: AuthorizationBypassSpike
        expr: sum(rate(http_requests_total{status="403"}[2m])) > 15
        for: 1m
        labels:
          severity: warning
          tier: security
        annotations:
          summary: "WARNING: Abnormal Volume of Authorization Rejections (403)"
          description: |
            More than 15 forbidden requests (403 Forbidden) per second detected. Possible IDOR probing or token expiration storm.
            Remediation: Review Clerk JWT token validation logs and inspect target API paths.

      - alert: RateLimitThresholdBreached
        expr: sum(rate(http_requests_total{status="429"}[2m])) > 50
        for: 1m
        labels:
          severity: warning
          tier: security
        annotations:
          summary: "WARNING: High Rate-Limit Violation Spike (429)"
          description: |
            More than 50 rate limit rejects per second across perimeter routes.
            Remediation: Inspect rate limiter keys in Redis and verify if malicious crawler or bot traffic is active.

      - alert: FalcoCriticalSecurityEvent
        expr: sum(rate(falco_events{priority="Critical"}[2m])) > 0
        for: 10s
        labels:
          severity: critical
          tier: security
        annotations:
          summary: "CRITICAL: Falco Runtime Intrusion Detection Event"
          description: |
            Falco eBPF runtime sensor detected a critical security event in container workloads (e.g. interactive shell spawn or metadata probe).
            Remediation: Check Falco alerts in Loki (`{app="falco"}`) immediately and isolate affected pod.

      - alert: PaymentWebhookSignatureFailureSpike
        expr: sum(rate(http_requests_total{service="payment-service",url=~".*webhook.*",status="400"}[5m])) > 5
        for: 2m
        labels:
          severity: critical
          tier: security
        annotations:
          summary: "CRITICAL: Payment Webhook Signature Tampering Detected"
          description: |
            More than 5 invalid Stripe webhook signatures per minute detected on payment-service.
            Possible replay attack or tampered webhook payload in transit.
            Remediation: Verify Stripe signing secret in External Secrets and inspect incoming webhook headers.

      - alert: SSRFMetadataAccessAttempt
        expr: sum(rate(http_requests_total{status="400",url=~".*169.254.169.254.*"}[2m])) > 0
        for: 10s
        labels:
          severity: critical
          tier: security
        annotations:
          summary: "CRITICAL: SSRF Attempt to Cloud Metadata Service Detected"
          description: |
            Inbound or outbound attempt to reach AWS/GCP instance metadata IP (169.254.169.254) detected.
            Remediation: Inspect application caller IP, review NetworkPolicy egress blocks, and quarantine the requesting client.

      - alert: SecretStoreSyncFailure
        expr: external_secrets_sync_errors_total > 0
        for: 5m
        labels:
          severity: critical
          tier: security
        annotations:
          summary: "CRITICAL: External Secrets Operator Sync Failure"
          description: |
            External Secrets Operator is failing to synchronize credentials from HashiCorp Vault or AWS Secrets Manager.
            Remediation: Inspect ESO logs (`kubectl logs -n external-secrets`) and check Vault token validity.

  # ══════════════════════════════════════════════════════
  # MLOPS MODEL DRIFT, INFERENCE LATENCY & CT HEALTH
  # ══════════════════════════════════════════════════════
  - name: mlops_health
    rules:
      - alert: HighFeatureDriftDetected
        expr: ml_feature_drift_psi > 0.25
        for: 5m
        labels:
          severity: warning
          tier: mlops
        annotations:
          summary: "High Feature Drift (PSI > 0.25) on {{ $labels.service }} ({{ $labels.feature }})"
          description: |
            Population Stability Index for feature {{ $labels.feature }} on {{ $labels.service }} reached {{ $value }}.
            Remediation: Trigger Continuous Training (CT) pipeline or inspect upstream feature distribution shift.

      - alert: MLInferenceLatencyHigh
        expr: histogram_quantile(0.95, rate(ml_inference_latency_seconds_bucket[5m])) > 0.1
        for: 3m
        labels:
          severity: warning
          tier: mlops
        annotations:
          summary: "ML Inference P95 Latency > 100ms on {{ $labels.service }}"
          description: |
            Model {{ $labels.model_name }} on {{ $labels.service }} P95 inference latency is {{ $value }}s.
            Remediation: Check pod CPU throttling, Redis feature store latency, or scale inference replicas.

      - alert: MLTrainingQualityGateRejected
        expr: increase(ml_model_training_runs_total{status=~"dataset_rejected|gate_rejected"}[1h]) > 0
        for: 1m
        labels:
          severity: critical
          tier: mlops
        annotations:
          summary: "CRITICAL: ML Training Run Rejected by Validation/Quality Gate"
          description: |
            A scheduled or manual retraining run on {{ $labels.service }} was rejected ({{ $labels.status }}).
            Remediation: Inspect MLflow experiment logs and dataset validation output before promoting any model.
