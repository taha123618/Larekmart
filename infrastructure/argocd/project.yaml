apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: larekmart
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "Larekmart E-Commerce Microservices Project"

  # Source repositories allowed for applications in this project
  sourceRepos:
    - "https://github.com/taha123618/Larekmart.git"
    - "git@github.com:taha123618/Larekmart.git"
    - "https://charts.bitnami.com/bitnami"
    - "https://prometheus-community.github.io/helm-charts"
    - "https://grafana.github.io/helm-charts"
    - "https://kubernetes.github.io/ingress-nginx"
    - "https://charts.jetstack.io"

  # Target clusters and namespaces allowed
  destinations:
    - namespace: "larekmart"
      server: "https://kubernetes.default.svc"
    - namespace: "larekmart-*"
      server: "https://kubernetes.default.svc"
    - namespace: "ingress-nginx"
      server: "https://kubernetes.default.svc"
    - namespace: "cert-manager"
      server: "https://kubernetes.default.svc"
    - namespace: "observability"
      server: "https://kubernetes.default.svc"
    - namespace: "argocd"
      server: "https://kubernetes.default.svc"

  # Cluster-scoped resources permitted
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRole
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRoleBinding
    - group: "networking.k8s.io"
      kind: IngressClass
    - group: "apiextensions.k8s.io"
      kind: CustomResourceDefinition
    - group: "cert-manager.io"
      kind: ClusterIssuer

  # Namespaced resources permitted
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  # Sync windows for scheduled deployments (optional freeze on prod)
  syncWindows:
    - kind: allow
      schedule: "* * * * *"
      duration: 1h
      applications:
        - "larekmart-dev"
        - "larekmart-staging"
      manualSync: true

  # Roles and RBAC for teams
  roles:
    - name: read-only
      description: "Read-only access to all Larekmart applications"
      policies:
        - p, proj:larekmart:read-only, applications, get, larekmart/*, allow
      groups:
        - "dev-team"
        - "qa-team"

    - name: admin
      description: "Full control over Larekmart applications"
      policies:
        - p, proj:larekmart:admin, applications, *, larekmart/*, allow
      groups:
        - "devops-team"
        - "sre-team"
