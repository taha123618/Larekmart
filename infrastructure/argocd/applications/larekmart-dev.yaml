apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: larekmart-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: larekmart
    env: development
spec:
  project: larekmart
  source:
    repoURL: "https://github.com/taha123618/Larekmart.git"
    targetRevision: HEAD
    path: infrastructure/kubernetes/overlays/development
  destination:
    server: "https://kubernetes.default.svc"
    namespace: larekmart-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
