apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: larekmart-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: larekmart
    app.kubernetes.io/component: gitops-root
spec:
  project: larekmart
  source:
    repoURL: "https://github.com/taha123618/Larekmart.git"
    targetRevision: HEAD
    path: infrastructure/argocd/applications
    recurse: true
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
