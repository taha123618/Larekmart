# ==============================================================================
# Debezium Server - Payout DB CDC Outbox Event Router
# ==============================================================================

# Kafka Sink Configuration
debezium.sink.type=kafka
debezium.sink.kafka.producer.bootstrap.servers=kafka:9092,kafka-broker-2:9092,kafka-broker-3:9092
debezium.sink.kafka.producer.key.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.value.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.acks=all
debezium.sink.kafka.producer.retries=3

# PostgreSQL Source Connector (pgoutput logical replication)
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.offset.storage=org.apache.kafka.connect.storage.KafkaOffsetBackingStore
debezium.source.offset.storage.kafka.bootstrap.servers=kafka:9092,kafka-broker-2:9092,kafka-broker-3:9092
debezium.source.offset.storage.kafka.topic=debezium.payout.offsets
debezium.source.offset.storage.kafka.partitions=1
debezium.source.offset.storage.kafka.replication.factor=1
debezium.source.offset.flush.interval.ms=1000

debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=postgres
debezium.source.database.password=password123
debezium.source.database.dbname=payout_db
debezium.source.topic.prefix=payout_cdc
debezium.source.table.include.list=public.outbox_events
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=debezium_payout_slot
debezium.source.publication.name=debezium_payout_pub
debezium.source.publication.autocreate.mode=all_tables
debezium.source.snapshot.mode=never
debezium.source.decimal.handling.mode=double

# Debezium Outbox Event Router (SMT)
debezium.transforms=outbox
debezium.transforms.outbox.type=io.debezium.transforms.outbox.EventRouter
debezium.transforms.outbox.table.fields.additional.placement=type:header:eventType
debezium.transforms.outbox.table.expand.json.payload=true
debezium.transforms.outbox.route.by.field=type
debezium.transforms.outbox.route.topic.replacement=${routedByValue}
