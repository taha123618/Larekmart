## NGINX Ingress Controller Helm Values for Larekmart (Staging & Production)
## Helm chart: ingress-nginx/ingress-nginx

controller:
  name: controller
  image:
    repository: registry.k8s.io/ingress-nginx/controller
    tag: "v1.11.2"
    digest: ""

  replicaCount: 2
  minAvailable: 1

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1024Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80

  config:
    # Security Headers & Proxy Buffering
    use-forwarded-headers: "true"
    compute-full-forwarded-for: "true"
    proxy-body-size: "25m"
    proxy-connect-timeout: "15"
    proxy-read-timeout: "600"
    proxy-send-timeout: "600"
    client-header-timeout: "60"
    client-body-timeout: "60"
    keep-alive-requests: "10000"
    keep-alive: "120"
    server-tokens: "false"
    hsts: "true"
    hsts-max-age: "31536000"
    hsts-include-subdomains: "true"
    ssl-protocols: "TLSv1.2 TLSv1.3"
    ssl-ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305"
    enable-brotli: "true"
    gzip: "true"
    gzip-types: "application/atom+xml application/javascript application/json application/ld+json application/manifest+json application/rss+xml application/vnd.geo+json application/vnd.ms-fontobject application/x-font-ttf application/x-web-app-manifest+json font/opentype image/bmp image/svg+xml image/x-icon text/cache-manifest text/css text/plain text/vcard text/vnd.rim.location.xloc text/vtt text/x-component text/x-cross-domain-policy"

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring
      labels:
        release: prometheus
      scrapeInterval: 15s

  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
      service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    externalTrafficPolicy: Local
