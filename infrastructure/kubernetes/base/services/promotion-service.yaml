apiVersion: apps/v1
kind: Deployment
metadata:
  name: promotion-service
  namespace: larekmart
  labels:
    app.kubernetes.io/name: promotion-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: larekmart
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: promotion-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: promotion-service
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: promotion-service
          image: larekmart/promotion-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8016
              protocol: TCP
          envFrom:
            - configMapRef:
                name: larekmart-common-config
            - secretRef:
                name: larekmart-secrets
          env:
            - name: PORT
              value: "8016"
            - name: DATABASE_URL
              value: "postgresql://postgres:$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/larekmart_promotion_db?sslmode=disable"
            - name: REDIS_URL
              value: "redis://$(REDIS_HOST):$(REDIS_PORT)"
            - name: KAFKA_BROKERS
              value: "$(KAFKA_BROKER)"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8016
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: 8016
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8016
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: promotion-service
  namespace: larekmart
  labels:
    app.kubernetes.io/name: promotion-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8016
      targetPort: 8016
  selector:
    app.kubernetes.io/name: promotion-service
