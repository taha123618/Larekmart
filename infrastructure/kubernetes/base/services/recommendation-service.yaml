apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
  namespace: larekmart
  labels:
    app.kubernetes.io/name: recommendation-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: larekmart
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: recommendation-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recommendation-service
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: recommendation-service
          image: larekmart/recommendation-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8008
              protocol: TCP
          envFrom:
            - configMapRef:
                name: larekmart-common-config
            - secretRef:
                name: larekmart-secrets
          env:
            - name: PORT
              value: "8008"
            - name: DATABASE_URL
              value: "postgresql+asyncpg://postgres:$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/recommendation_db"
            - name: CELERY_BROKER_URL
              value: "$(REDIS_URL)/1"
            - name: CELERY_RESULT_BACKEND
              value: "$(REDIS_URL)/2"
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 800m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health
              port: 8008
            initialDelaySeconds: 8
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: 8008
            initialDelaySeconds: 25
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8008
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-service
  namespace: larekmart
  labels:
    app.kubernetes.io/name: recommendation-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8008
      targetPort: 8008
  selector:
    app.kubernetes.io/name: recommendation-service
