apiVersion: apps/v1
kind: Deployment
metadata:
  name: return-service
  namespace: larekmart
  labels:
    app.kubernetes.io/name: return-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: larekmart
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: return-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: return-service
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: return-service
          image: larekmart/return-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8018
              protocol: TCP
          envFrom:
            - configMapRef:
                name: larekmart-common-config
            - secretRef:
                name: larekmart-secrets
          env:
            - name: PORT
              value: "8018"
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              value: "mysql://root:$(MYSQL_PASSWORD)@$(MYSQL_HOST):3306/return_db"
            - name: REDIS_URL
              value: "redis://$(REDIS_HOST):$(REDIS_PORT)"
            - name: KAFKA_BROKERS
              value: "$(KAFKA_BROKER)"
            - name: KAFKA_CLIENT_ID
              value: "return-service"
            - name: KAFKA_GROUP_ID
              value: "return-service-group"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8018
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: 8018
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8018
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: return-service
  namespace: larekmart
  labels:
    app.kubernetes.io/name: return-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8018
      targetPort: 8018
  selector:
    app.kubernetes.io/name: return-service
