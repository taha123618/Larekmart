apiVersion: apps/v1
kind: Deployment
metadata:
  name: larekmart-api-gateway
  namespace: larekmart
  labels:
    app.kubernetes.io/name: larekmart
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/part-of: larekmart
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: larekmart
      app.kubernetes.io/component: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: larekmart
        app.kubernetes.io/component: api-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: api-gateway
          image: larekmart/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: larekmart-common-config
            - secretRef:
                name: larekmart-secrets
          env:
            - name: PORT
              value: "8080"
            - name: HOST
              value: "0.0.0.0"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: larekmart-secrets
                  key: REDIS_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: larekmart-api-gateway
  namespace: larekmart
  labels:
    app.kubernetes.io/name: larekmart
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/part-of: larekmart
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: larekmart
    app.kubernetes.io/component: api-gateway
