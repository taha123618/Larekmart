apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytic-service
  namespace: larekmart
  labels:
    app.kubernetes.io/name: analytic-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: larekmart
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: analytic-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analytic-service
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: analytic-service
          image: larekmart/analytic-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8004
              protocol: TCP
          envFrom:
            - configMapRef:
                name: larekmart-common-config
            - secretRef:
                name: larekmart-secrets
          env:
            - name: PORT
              value: "8004"
            - name: APP_ENV
              value: "production"
            - name: DATABASE_URL
              value: "postgresql://postgres:$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/analytics_db?sslmode=disable"
            - name: REDIS_URL
              value: "$(REDIS_URL)"
            - name: REDIS_KEY_PREFIX
              value: "analytics:v1:"
            - name: KAFKA_BROKERS
              value: "$(KAFKA_BROKERS)"
            - name: KAFKA_GROUP_ID
              value: "analytic-service-group"
            - name: ANALYTICS_BATCH_SIZE
              value: "1000"
            - name: ANALYTICS_FLUSH_INTERVAL_MS
              value: "500"
            - name: ANALYTICS_QUEUE_CAPACITY
              value: "10000"
            - name: ANALYTICS_WORKER_COUNT
              value: "4"
            - name: CLIENT_URL
              value: "https://shop.larekmart.com"
            - name: ADMIN_URL
              value: "https://admin.larekmart.com"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: analytic-service
  namespace: larekmart
  labels:
    app.kubernetes.io/name: analytic-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8004
      targetPort: 8004
  selector:
    app.kubernetes.io/name: analytic-service
