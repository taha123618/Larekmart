apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-service
  namespace: larekmart
  labels:
    app.kubernetes.io/name: media-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: larekmart
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: media-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: media-service
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: media-service
          image: larekmart/media-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8013
              protocol: TCP
          envFrom:
            - configMapRef:
                name: larekmart-common-config
            - secretRef:
                name: larekmart-secrets
          env:
            - name: PORT
              value: "8013"
            - name: DATABASE_URL
              value: "postgresql://postgres:$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/media_db?sslmode=disable"
            - name: S3_ENDPOINT
              value: "http://minio.larekmart.svc.cluster.local:9000"
            - name: S3_REGION
              value: "us-east-1"
            - name: S3_BUCKET
              value: "media"
            - name: S3_FORCE_PATH_STYLE
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8013
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: 8013
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8013
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: media-service
  namespace: larekmart
  labels:
    app.kubernetes.io/name: media-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8013
      targetPort: 8013
  selector:
    app.kubernetes.io/name: media-service
