apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-service
  namespace: larekmart
  labels:
    app.kubernetes.io/name: fraud-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: larekmart
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: fraud-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fraud-service
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: fraud-service
          image: larekmart/fraud-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8024
              protocol: TCP
          envFrom:
            - configMapRef:
                name: larekmart-common-config
            - secretRef:
                name: larekmart-secrets
          env:
            - name: PORT
              value: "8024"
            - name: APP_ENV
              value: "production"
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):5432/fraud_db"
            - name: REDIS_URL
              value: "redis://$(REDIS_HOST):6379/4"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "$(KAFKA_BOOTSTRAP_SERVERS)"
            - name: KAFKA_ENABLED
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8024
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8024
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-service
  namespace: larekmart
  labels:
    app.kubernetes.io/name: fraud-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: larekmart
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8024
      targetPort: 8024
      protocol: TCP
  selector:
    app.kubernetes.io/name: fraud-service

