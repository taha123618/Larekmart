# ==============================================================================
# Larekmart - GPU-Accelerated Inference Deployment (Optional GPU Node Pool)
# Deploy when upgrading embedding/neural ranker models to CUDA inference.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding-gpu-inference
  namespace: larekmart
  labels:
    app.kubernetes.io/name: embedding-gpu-inference
    app.kubernetes.io/component: mlops
    app.kubernetes.io/part-of: larekmart
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: embedding-gpu-inference
  template:
    metadata:
      labels:
        app.kubernetes.io/name: embedding-gpu-inference
        app.kubernetes.io/component: mlops
    spec:
      serviceAccountName: mlops-trainer-sa
      nodeSelector:
        accelerator: nvidia-tesla-t4
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gpu-inference
          image: larekmart/recommendation-gpu-inference:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8008
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: 4000m
              memory: 8Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
