apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mlflow-tracking-ingress
  namespace: larekmart
  labels:
    app.kubernetes.io/part-of: larekmart
    app.kubernetes.io/component: mlops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mlflow-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fraud-service
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: recommendation-service
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: mlops
      ports:
        - protocol: TCP
          port: 5000
