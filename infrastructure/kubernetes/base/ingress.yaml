apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: larekmart-ingress
  namespace: larekmart
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "notification-service"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, PUT, POST, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,X-Guest-Id"
spec:
  tls:
    - hosts:
        - larekmart.com
        - admin.larekmart.com
        - api.larekmart.com
      secretName: larekmart-tls
  rules:
    - host: larekmart.com
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 8005
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client
                port:
                  number: 3002

    - host: admin.larekmart.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin
                port:
                  number: 3003

    - host: api.larekmart.com
      http:
        paths:
          - path: /api/v1/products
            pathType: Prefix
            backend:
              service:
                name: product-service
                port:
                  number: 8000
          - path: /api/v1/orders
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 8001
          - path: /api/v1/payments
            pathType: Prefix
            backend:
              service:
                name: payment-service
                port:
                  number: 8002
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8003
          - path: /api/v1/analytics
            pathType: Prefix
            backend:
              service:
                name: analytic-service
                port:
                  number: 8004
          - path: /api/v1/notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 8005
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 8005
          - path: /api/v1/search
            pathType: Prefix
            backend:
              service:
                name: search-service
                port:
                  number: 8006
          - path: /api/v1/inventory
            pathType: Prefix
            backend:
              service:
                name: inventory-service
                port:
                  number: 8007
          - path: /api/v1/recommendations
            pathType: Prefix
            backend:
              service:
                name: recommendation-service
                port:
                  number: 8008
          - path: /api/v1/cart
            pathType: Prefix
            backend:
              service:
                name: cart-service
                port:
                  number: 8009
          - path: /api/v1/catalog
            pathType: Prefix
            backend:
              service:
                name: catalog-service
                port:
                  number: 8010
          - path: /api/v1/shipping
            pathType: Prefix
            backend:
              service:
                name: shipping-service
                port:
                  number: 8011
          - path: /api/v1/users
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 8012
          - path: /api/v1/media
            pathType: Prefix
            backend:
              service:
                name: media-service
                port:
                  number: 8013
          - path: /api/v1/reviews
            pathType: Prefix
            backend:
              service:
                name: review-service
                port:
                  number: 8014
          - path: /api/v1/shared-wishlists
            pathType: Prefix
            backend:
              service:
                name: wishlist-service
                port:
                  number: 8015
          - path: /api/v1/me/wishlists
            pathType: Prefix
            backend:
              service:
                name: wishlist-service
                port:
                  number: 8015
          - path: /api/v1/admin/wishlists
            pathType: Prefix
            backend:
              service:
                name: wishlist-service
                port:
                  number: 8015
          - path: /api/v1/promotions
            pathType: Prefix
            backend:
              service:
                name: promotion-service
                port:
                  number: 8016
          - path: /api/v1/admin/promotions
            pathType: Prefix
            backend:
              service:
                name: promotion-service
                port:
                  number: 8016
          - path: /api/v1/admin/coupons
            pathType: Prefix
            backend:
              service:
                name: promotion-service
                port:
                  number: 8016

