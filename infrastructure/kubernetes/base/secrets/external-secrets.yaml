apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: larekmart-external-secrets
  namespace: larekmart
  labels:
    app.kubernetes.io/name: larekmart-external-secrets
    app.kubernetes.io/part-of: larekmart
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: larekmart-secret-store
    kind: SecretStore
  target:
    name: larekmart-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: larekmart-secrets
          app.kubernetes.io/part-of: larekmart
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        POSTGRES_PASSWORD: "{{ .POSTGRES_PASSWORD }}"
        MONGODB_URI: "{{ .MONGODB_URI }}"
        MONGODB_CART_URI: "{{ .MONGODB_CART_URI }}"
        CLERK_SECRET_KEY: "{{ .CLERK_SECRET_KEY }}"
        CLERK_PUBLISHABLE_KEY: "{{ .CLERK_PUBLISHABLE_KEY }}"
        STRIPE_SECRET_KEY: "{{ .STRIPE_SECRET_KEY }}"
        STRIPE_WEBHOOK_SECRET: "{{ .STRIPE_WEBHOOK_SECRET }}"
        REDIS_PASSWORD: "{{ .REDIS_PASSWORD }}"
        OPENSEARCH_INITIAL_ADMIN_PASSWORD: "{{ .OPENSEARCH_INITIAL_ADMIN_PASSWORD }}"
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: production/larekmart/database
        property: postgres_password
    - secretKey: MONGODB_URI
      remoteRef:
        key: production/larekmart/database
        property: mongodb_order_uri
    - secretKey: MONGODB_CART_URI
      remoteRef:
        key: production/larekmart/database
        property: mongodb_cart_uri
    - secretKey: CLERK_SECRET_KEY
      remoteRef:
        key: production/larekmart/auth
        property: clerk_secret_key
    - secretKey: CLERK_PUBLISHABLE_KEY
      remoteRef:
        key: production/larekmart/auth
        property: clerk_publishable_key
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: production/larekmart/payments
        property: stripe_secret_key
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: production/larekmart/payments
        property: stripe_webhook_secret
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: production/larekmart/cache
        property: redis_password
    - secretKey: OPENSEARCH_INITIAL_ADMIN_PASSWORD
      remoteRef:
        key: production/larekmart/search
        property: opensearch_admin_password
