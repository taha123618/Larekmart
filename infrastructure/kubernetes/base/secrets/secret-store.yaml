apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: larekmart-secret-store
  namespace: larekmart
  labels:
    app.kubernetes.io/name: larekmart-secret-store
    app.kubernetes.io/part-of: larekmart
spec:
  provider:
    # Default provider: AWS Secrets Manager.
    # Can also be switched to HashiCorp Vault, GCP Secret Manager, or Azure Key Vault.
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: larekmart-cluster-secret-store
  labels:
    app.kubernetes.io/name: larekmart-cluster-secret-store
    app.kubernetes.io/part-of: larekmart
spec:
  provider:
    vault:
      server: "https://vault.internal:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "larekmart-workload"
          serviceAccountRef:
            name: external-secrets-sa
            namespace: larekmart
