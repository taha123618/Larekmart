apiVersion: v1
kind: Secret
metadata:
  name: larekmart-secrets
  namespace: larekmart
  annotations:
    description: "Template secret for production workloads. In production, use ExternalSecrets Operator or SealedSecrets."
type: Opaque
# Bootstrap-only placeholders. The ExternalSecret `larekmart-external-secrets`
# owns the real `larekmart-secrets` values in production; every value below is
# deliberately invalid so a deployment that forgets External Secrets fails
# startup validation instead of running with publicly known credentials.
stringData:
  POSTGRES_PASSWORD: "__REQUIRED_EXTERNAL_SECRET__"
  POSTGRES_READ_REPLICA_PASSWORD: "__REQUIRED_EXTERNAL_SECRET__"
  MONGODB_URI: "__REQUIRED_EXTERNAL_SECRET__"
  MONGODB_CART_URI: "__REQUIRED_EXTERNAL_SECRET__"

  CLERK_SECRET_KEY: "__REQUIRED_EXTERNAL_SECRET__"
  CLERK_PUBLISHABLE_KEY: "__REQUIRED_EXTERNAL_SECRET__"

  STRIPE_SECRET_KEY: "__REQUIRED_EXTERNAL_SECRET__"
  STRIPE_WEBHOOK_SECRET: "__REQUIRED_EXTERNAL_SECRET__"

  REDIS_PASSWORD: "__REQUIRED_EXTERNAL_SECRET__"
  OPENSEARCH_INITIAL_ADMIN_PASSWORD: "__REQUIRED_EXTERNAL_SECRET__"
  INTERNAL_SERVICE_SECRET: "__REQUIRED_EXTERNAL_SECRET__"
