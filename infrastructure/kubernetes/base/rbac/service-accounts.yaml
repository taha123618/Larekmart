apiVersion: v1
kind: ServiceAccount
metadata:
  name: larekmart-frontend-sa
  namespace: larekmart
  labels:
    app.kubernetes.io/name: larekmart
    app.kubernetes.io/component: rbac
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/larekmart-frontend-irsa"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: larekmart-gateway-sa
  namespace: larekmart
  labels:
    app.kubernetes.io/name: larekmart
    app.kubernetes.io/component: rbac
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/larekmart-gateway-irsa"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: larekmart-backend-sa
  namespace: larekmart
  labels:
    app.kubernetes.io/name: larekmart
    app.kubernetes.io/component: rbac
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/larekmart-backend-irsa"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: larekmart-worker-sa
  namespace: larekmart
  labels:
    app.kubernetes.io/name: larekmart
    app.kubernetes.io/component: rbac
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/larekmart-worker-irsa"
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: larekmart-workload-minimal-role
  namespace: larekmart
rules:
  # Least-privilege: Workloads do not have access to cluster or namespace APIs by default
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: larekmart-workload-minimal-binding
  namespace: larekmart
subjects:
  - kind: ServiceAccount
    name: larekmart-backend-sa
    namespace: larekmart
  - kind: ServiceAccount
    name: larekmart-gateway-sa
    namespace: larekmart
  - kind: ServiceAccount
    name: larekmart-frontend-sa
    namespace: larekmart
  - kind: ServiceAccount
    name: larekmart-worker-sa
    namespace: larekmart
roleRef:
  kind: Role
  name: larekmart-workload-minimal-role
  apiGroup: rbac.authorization.k8s.io
