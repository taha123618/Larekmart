apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: larekmart
  labels:
    app.kubernetes.io/name: admin
    app.kubernetes.io/component: admin-dashboard
    app.kubernetes.io/part-of: larekmart
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin
        app.kubernetes.io/component: admin-dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: admin
          image: larekmart/admin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3003
              protocol: TCP
          envFrom:
            - configMapRef:
                name: larekmart-common-config
            - secretRef:
                name: larekmart-secrets
          env:
            - name: PORT
              value: "3003"
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 800m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /
              port: 3003
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 3003
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: larekmart
  labels:
    app.kubernetes.io/name: admin
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3003
      targetPort: 3003
  selector:
    app.kubernetes.io/name: admin
