apiVersion: apps/v1
kind: Deployment
metadata:
  name: seller
  namespace: larekmart
  labels:
    app.kubernetes.io/name: seller
    app.kubernetes.io/component: seller-dashboard
    app.kubernetes.io/part-of: larekmart
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: seller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seller
        app.kubernetes.io/component: seller-dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: seller
          image: larekmart/seller:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3004
              protocol: TCP
          envFrom:
            - configMapRef:
                name: larekmart-common-config
            - secretRef:
                name: larekmart-secrets
          env:
            - name: PORT
              value: "3004"
            - name: HOST
              value: "0.0.0.0"
            - name: NUXT_API_GATEWAY_URL
              value: "http://api-gateway:8090"
            - name: NUXT_PUBLIC_API_GATEWAY_URL
              value: "https://api.larekmart.com"
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 800m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /api/health
              port: 3004
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3004
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3004
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: seller
  namespace: larekmart
  labels:
    app.kubernetes.io/name: seller
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3004
      targetPort: 3004
  selector:
    app.kubernetes.io/name: seller
