apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: larekmart

resources:
  - namespace.yaml
  - configmaps/common-config.yaml
  - secrets/secret-templates.yaml
  - secrets/secret-store.yaml
  - secrets/external-secrets.yaml
  - ingress.yaml
  - frontends/client.yaml
  - frontends/admin.yaml
  - services/product-service.yaml
  - services/order-service.yaml
  - services/payment-service.yaml
  - services/auth-service.yaml
  - services/analytic-service.yaml
  - services/notification-service.yaml
  - services/search-service.yaml
  - services/inventory-service.yaml
  - services/recommendation-service.yaml
  - services/cart-service.yaml
  - services/catalog-service.yaml
  - services/shipping-service.yaml
  - services/user-service.yaml
  - services/media-service.yaml
  - services/review-service.yaml
  - services/wishlist-service.yaml
  - services/promotion-service.yaml
  - services/tax-service.yaml
  - services/return-service.yaml
  - services/pricing-service.yaml
  - services/vendor-service.yaml
  - services/seller-service.yaml
  - workers/email-service.yaml
  - autoscaling/hpa.yaml
  - autoscaling/keda-scaledobjects.yaml
  - pdb/pod-disruption-budgets.yaml
  - network-policies/network-policies.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: larekmart
      app.kubernetes.io/managed-by: kustomize
